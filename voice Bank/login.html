<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Voice Banking</title>
  <link rel="stylesheet" href="style2.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .kannada-text {
      font-family: 'Noto Sans Kannada', sans-serif;
    }
    .login-card {
      background: rgba(152, 251, 152, 0.15);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 450px;
      margin: 0 auto;
    }
    .login-title {
      font-size: 2rem;
      font-weight: 700;
      color: #90EE90;
      text-shadow: 0 0 10px rgba(144, 238, 144, 0.5);
      margin-bottom: 30px;
    }
    .login-input {
      width: 100%;
      padding: 15px 20px;
      margin-bottom: 20px;
      border: 2px solid rgba(144, 238, 144, 0.3);
      border-radius: 12px;
      background: rgba(152, 251, 152, 0.2);
      color: white;
      font-size: 16px;
      transition: all 0.3s;
    }
    .login-input:focus {
      outline: none;
      border-color: #90EE90;
      box-shadow: 0 0 15px rgba(144, 238, 144, 0.4);
      background: rgba(152, 251, 152, 0.3);
    }
    .login-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #90EE90, #32CD32);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(144, 238, 144, 0.4);
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(144, 238, 144, 0.6);
    }
    .back-btn {
      width: 100%;
      padding: 12px;
      background: rgba(70, 70, 70, 0.6);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: rgba(70, 70, 70, 0.8);
    }
    .register-link {
      margin-top: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }
    .register-link a {
      color: #4facfe;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <div class="login-card fade-in">
      <h2 class="login-title">Login</h2>
      
      <form id="loginForm">
        <input type="text" class="login-input" id="accountNumber" placeholder="Account Number" maxlength="12" pattern="[0-9]{12}" required>
        <input type="password" class="login-input" id="pin" placeholder="4-digit PIN" maxlength="4" pattern="[0-9]{4}" required>
        
        <button type="submit" class="login-btn">Login</button>
        <a href="index.html" class="back-btn">
          <span>⬅️</span>
          <span>Back to Dashboard</span>
        </a>
        
        <div class="register-link">
          Don't have an account? <a href="register.html">Register</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    // Get stored language or default to English
    const storedLang = sessionStorage.getItem('selectedLanguage') || 'en';
    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = storedLang === 'hi' ? 'hi-IN' : storedLang === 'kn' ? 'kn-IN' : 'en-US';
    }
    
    // Update page text based on language
    const langTexts = {
      en: {
        title: "Login",
        accountPlaceholder: "Account Number",
        pinPlaceholder: "4-digit PIN",
        button: "Login",
        back: "Back to Dashboard",
        registerLink: "Don't have an account?",
        register: "Register",
        welcome: "Welcome to login page. Please say your account number, then your four digit PIN."
      },
      hi: {
        title: "लॉगिन",
        accountPlaceholder: "खाता संख्या",
        pinPlaceholder: "4 अंकों का PIN",
        button: "लॉगिन",
        back: "डैशबोर्ड पर वापस जाएँ",
        registerLink: "खाता नहीं है?",
        register: "पंजीकरण करें",
        welcome: "लॉगिन पृष्ठ पर स्वागत है। कृपया अपना खाता नंबर बताएं, फिर अपना चार अंकों का PIN।"
      },
      kn: {
        title: "ಲಾಗಿನ್",
        accountPlaceholder: "ಖಾತೆ ಸಂಖ್ಯೆ",
        pinPlaceholder: "4 ಅಂಕೆಗಳ PIN",
        button: "ಲಾಗಿನ್",
        back: "ಡ್ಯಾಶ್ಬೋರ್ಡ್ಗೆ ಹಿಂತಿರುಗಿ",
        registerLink: "ಖಾತೆ ಇಲ್ಲವೇ?",
        register: "ನೋಂದಣಿ",
        welcome: "ಲಾಗಿನ್ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ। ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ, ನಂತರ ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN."
      }
    };
    
    // Update page content based on language
    function updatePageLanguage(lang) {
      const texts = langTexts[lang] || langTexts.en;
      const titleEl = document.querySelector('.login-title');
      if (titleEl) {
        titleEl.innerText = texts.title;
        if (lang === 'kn') {
          titleEl.classList.add('kannada-text');
        } else {
          titleEl.classList.remove('kannada-text');
        }
      }
      const accountInput = document.getElementById('accountNumber');
      if (accountInput) accountInput.placeholder = texts.accountPlaceholder;
      const pinInput = document.getElementById('pin');
      if (pinInput) pinInput.placeholder = texts.pinPlaceholder;
      const btn = document.querySelector('.login-btn');
      if (btn) {
        btn.innerText = texts.button;
        if (lang === 'kn') {
          btn.classList.add('kannada-text');
        } else {
          btn.classList.remove('kannada-text');
        }
      }
      const backBtn = document.querySelector('.back-btn span:last-child');
      if (backBtn) backBtn.innerText = texts.back;
      const registerLink = document.querySelector('.register-link');
      if (registerLink) {
        registerLink.innerHTML = `${texts.registerLink} <a href="register.html">${texts.register}</a>`;
      }
    }
    
    // Apply language on page load - wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        if (storedLang !== 'en') {
          updatePageLanguage(storedLang);
        }
      });
    } else {
      if (storedLang !== 'en') {
        updatePageLanguage(storedLang);
      }
    }

    function speak(text, lang = storedLang) {
      const voices = speechSynthesis.getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (lang === 'hi') {
        const hindiVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('hi') || 
          v.lang.toLowerCase().includes('hindi') || 
          v.name.toLowerCase().includes('hindi') ||
          v.lang === 'hi-IN' || v.lang === 'hi'
        );
        utterance.lang = 'hi-IN';
        if (hindiVoice) utterance.voice = hindiVoice;
      } else if (lang === 'kn') {
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' || v.lang === 'kn'
        );
        utterance.lang = 'kn-IN';
        if (kannadaVoice) utterance.voice = kannadaVoice;
      } else {
        utterance.lang = 'en-US';
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      try {
        recognition.stop();
      } catch(e) {}
      
      recognition.onresult = (event) => {
        if (event.results.length > 0) {
          const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
          console.log("Heard:", command);
          handleVoiceCommand(command);
        }
      };
      
      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          alert("Microphone permission denied");
          isListening = false;
        } else if (event.error !== 'aborted' && event.error !== 'no-speech') {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e) {}
            }
          }, 1000);
        }
      };
      
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            try { recognition.start(); } catch(e) {}
          }, 500);
        }
      };
      
      try {
        recognition.start();
        isListening = true;
      } catch(e) {
        console.log("Error:", e);
      }
    }

    function handleVoiceCommand(command) {
      const accountInput = document.getElementById("accountNumber");
      const pinInput = document.getElementById("pin");
      
      const accountMatch = command.match(/(?:account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
      if (accountMatch && !accountInput.value) {
        const accNum = accountMatch[1] || accountMatch[2] || accountMatch[3];
        accountInput.value = accNum;
        const msg = storedLang === 'hi' 
          ? `खाता संख्या ${accNum} दर्ज किया गया। कृपया अपना PIN बताएं।`
          : storedLang === 'kn'
          ? `ಖಾತೆ ಸಂಖ್ಯೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ। ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ।`
          : `Account number ${accNum} entered. Please say your PIN.`;
        speak(msg, storedLang);
        setTimeout(() => startListening(), 2000);
        return;
      }
      
      const pinMatch = command.match(/(\d{4})/);
      if (pinMatch && accountInput.value && !pinInput.value) {
        const pin = pinMatch[1];
        pinInput.value = pin;
        const msg = storedLang === 'hi'
          ? "PIN दर्ज किया गया। लॉगिन हो रहा है।"
          : storedLang === 'kn'
          ? "PIN ನಮೂದಿಸಲಾಗಿದೆ। ಲಾಗಿನ್ ಆಗುತ್ತಿದೆ।"
          : "PIN entered. Logging in.";
        speak(msg, storedLang);
        setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
      }
    }

    window.addEventListener('load', () => {
      const welcomeText = langTexts[storedLang]?.welcome || langTexts.en.welcome;
      setTimeout(() => {
        speak(welcomeText, storedLang);
        setTimeout(() => startListening(), 3000);
      }, 1000);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }

      let account_number = document.getElementById("accountNumber").value.trim();
      const pin = document.getElementById("pin").value;

      if (!account_number || !pin) {
        const msg = storedLang === 'hi'
          ? "कृपया खाता संख्या और PIN दर्ज करें"
          : storedLang === 'kn'
          ? "ದಯವಿಟ್ಟು ಖಾತೆ ಸಂಖ್ಯೆ ಮತ್ತು PIN ನಮೂದಿಸಿ"
          : "Please enter account number and PIN";
        speak(msg, storedLang);
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        const msg = storedLang === 'hi'
          ? "PIN बिल्कुल 4 अंकों का होना चाहिए"
          : storedLang === 'kn'
          ? "PIN ನಿಖರವಾಗಿ 4 ಅಂಕೆಗಳಾಗಿರಬೇಕು"
          : "PIN must be exactly 4 digits";
        speak(msg, storedLang);
        return;
      }

      // Ensure account number is valid (remove any non-numeric characters)
      account_number = account_number.replace(/\D/g, '');
      if (account_number.length < 4 || account_number.length > 12) {
        const msg = storedLang === 'hi'
          ? "कृपया 4 से 12 अंकों के बीच एक वैध खाता संख्या दर्ज करें"
          : storedLang === 'kn'
          ? "ದಯವಿಟ್ಟು 4 ರಿಂದ 12 ಅಂಕೆಗಳ ನಡುವೆ ಮಾನ್ಯ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ"
          : "Please enter a valid account number between 4 and 12 digits";
        speak(msg, storedLang);
        return;
      }

      // Convert to integer for consistency
      const accNumInt = parseInt(account_number, 10);
      if (isNaN(accNumInt)) {
        const msg = storedLang === 'hi'
          ? "अमान्य खाता संख्या प्रारूप"
          : storedLang === 'kn'
          ? "ಅಮಾನ್ಯ ಖಾತೆ ಸಂಖ್ಯೆ ಸ್ವರೂಪ"
          : "Invalid account number format";
        speak(msg, storedLang);
        return;
      }

      const verifyMsg = storedLang === 'hi'
        ? "आपकी साख सत्यापित की जा रही है। कृपया प्रतीक्षा करें।"
        : storedLang === 'kn'
        ? "ನಿಮ್ಮ ಪ್ರಮಾಣಪತ್ರಗಳನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ। ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ।"
        : "Verifying your credentials. Please wait.";
      speak(verifyMsg, storedLang);

      // Verify PIN
      try {
        const response = await fetch("http://localhost:5000/verify-pin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account_number: accNumInt, pin })
        });

        const data = await response.json();

        if (response.ok) {
          const successMsg = storedLang === 'hi'
            ? "लॉगिन सफल! मेनू पर रीडायरेक्ट हो रहे हैं।"
            : storedLang === 'kn'
            ? "ಲಾಗಿನ್ ಯಶಸ್ವಿಯಾಗಿದೆ! ಮೆನುವಿಗೆ ಮರುನಿರ್ದೇಶಿಸಲಾಗುತ್ತಿದೆ।"
            : "Login successful! Redirecting to menu.";
          speak(successMsg, storedLang);
          // Store account number as integer for consistency
          sessionStorage.setItem('loggedInAccount', String(accNumInt));
          // Preserve selected language
          sessionStorage.setItem('selectedLanguage', storedLang);
          // Get account details to show in menu
          const accountResponse = await fetch(`http://localhost:5000/api/balance/${accNumInt}`);
          if (accountResponse.ok) {
            const accountData = await accountResponse.json();
            sessionStorage.setItem('accountName', accountData.fullName);
          }
          setTimeout(() => {
            window.location.href = "index.html";
          }, 2000);
        } else {
          const errorMsg = storedLang === 'hi'
            ? (data.message || "अमान्य खाता संख्या या PIN। कृपया पुनः प्रयास करें।")
            : storedLang === 'kn'
            ? (data.message || "ಅಮಾನ್ಯ ಖಾತೆ ಸಂಖ್ಯೆ ಅಥವಾ PIN। ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ।")
            : (data.message || "Invalid account number or PIN. Please try again.");
          speak(errorMsg, storedLang);
          alert(data.message || "Login failed");
        }
      } catch (error) {
        const errorMsg = storedLang === 'hi'
          ? "सर्वर तक पहुंच नहीं सकी। कृपया अपना कनेक्शन जांचें।"
          : storedLang === 'kn'
          ? "ಸರ್ವರ್ ತಲುಪಲು ಸಾಧ್ಯವಿಲ್ಲ। ದಯವಿಟ್ಟು ನಿಮ್ಮ ಸಂಪರ್ಕವನ್ನು ಪರಿಶೀಲಿಸಿ।"
          : "Server not reachable. Please check your connection.";
        speak(errorMsg, storedLang);
        alert("❌ Server not reachable. Please make sure the server is running.");
        console.error("Error:", error);
      }
    });

    // Microphone button
    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #90EE90; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (isListening) {
        recognition.stop();
        isListening = false;
        micBtn.style.background = '#90EE90';
      } else {
        const listenMsg = storedLang === 'hi'
          ? "सुन रहे हैं। कृपया अपना खाता नंबर और PIN बताएं।"
          : storedLang === 'kn'
          ? "ಕೇಳುತ್ತಿದ್ದೇನೆ। ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆ ಮತ್ತು PIN ಅನ್ನು ಹೇಳಿ।"
          : "Listening. Please say your account number and PIN.";
        speak(listenMsg, storedLang);
        micBtn.style.background = '#ff6b6b';
        setTimeout(() => startListening(), 1000);
      }
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
