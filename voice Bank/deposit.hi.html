<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>जमा करें - एआई वॉयस बैंकिंग</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">💰 जमा करें</h1>
    <p class="subtitle">पैसा जमा करने के लिए विवरण भरें</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>खाता संख्या (12 अंक)</label>
      </div>

      <div class="input-group">
        <input type="number" id="depositAmount" required>
        <label>जमा राशि (₹)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ जमा करें</button>
      <a href="index.html" class="btn-back">⬅️ मेनू पर वापस जाएँ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("depositAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';
    }

    function getVoices() {
      return speechSynthesis.getVoices();
    }
    
    function speak(text) {
      const voices = getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      // Try to find Hindi voice - check multiple patterns
      const hindiVoice = voices.find(v => 
        v.lang.toLowerCase().startsWith('hi') || 
        v.lang.toLowerCase().includes('hindi') || 
        v.name.toLowerCase().includes('hindi') ||
        v.lang === 'hi-IN' ||
        v.lang === 'hi'
      );
      
      if (hindiVoice) {
        utterance.lang = 'hi-IN';
        utterance.voice = hindiVoice;
        utterance.text = text; // Use original Hindi text
        console.log("✅ Using Hindi voice:", hindiVoice.name, hindiVoice.lang);
      } else {
        console.log("⚠️ Hindi voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
        // Still try to use Hindi language code - browser might have a fallback
        utterance.lang = 'hi-IN';
        utterance.text = text; // Keep original Hindi text
        console.log("🔊 Attempting to speak Hindi text with hi-IN language code");
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      console.log("🔊 Speaking in Hindi page:", text.substring(0, 50));
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
      isListening = true;
      recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        handleVoiceCommand(command);
      };
      recognition.onend = () => { isListening = false; };
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("depositAmount");
      const accountMatch = command.match(/(?:खाता|नंबर|account)\s*(\d+)|(\d{12})|(\d{4,12})/);
      if (accountMatch) {
        const accNum = accountMatch[1] || accountMatch[2];
        accountInput.value = accNum;
        speak(`खाता संख्या ${accNum} दर्ज की गई। कृपया जमा राशि बताएं।`);
        setTimeout(() => startListening(), 2000);
        return;
      }
      const amountMatch = command.match(/(\d+)\s*(?:रुपये|rupees|rs)/i) || command.match(/(\d+)/);
      if (amountMatch && accountInput.value) {
        const amount = amountMatch[1];
        amountInput.value = amount;
        speak(`राशि ${amount} रुपये दर्ज की गई। जमा प्रसंस्करण।`);
        setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        return;
      }
      if (command.includes('पांच सौ') || command.includes('500')) {
        amountInput.value = 500;
        speak("पांच सौ रुपये चुने गए");
      } else if (command.includes('एक हज़ार') || command.includes('1000')) {
        amountInput.value = 1000;
        speak("एक हज़ार रुपये चुने गए");
      } else if (command.includes('दो हज़ार') || command.includes('2000')) {
        amountInput.value = 2000;
        speak("दो हज़ार रुपये चुने गए");
      } else if (command.includes('पांच हज़ार') || command.includes('5000')) {
        amountInput.value = 5000;
        speak("पांच हज़ार रुपये चुने गए");
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        speak("जमा पृष्ठ पर आपका स्वागत है। कृपया अपनी खाता संख्या बताएं, फिर जमा राशि।");
        setTimeout(() => startListening(), 4000);
      }, 1000);
    });

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const deposit_amount = parseFloat(document.getElementById("depositAmount").value);
      if (!account_number || !deposit_amount) {
        speak("कृपया खाता संख्या और राशि दर्ज करें");
        return;
      }
      speak("आपकी जमा राशि प्रसंस्करण की जा रही है। कृपया प्रतीक्षा करें।");
      const response = await fetch("http://localhost:5000/deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_number, deposit_amount })
      });
      const data = await response.json();
      if (response.ok && data.new_balance !== undefined) {
        speak(`जमा सफल! आपका नया बैलेंस ${data.new_balance} रुपये है।`);
        
        // Store transaction data for receipt
        const transactionData = {
          type: 'Deposit',
          type_hi: 'जमा',
          account_number: data.account_number,
          full_name: data.full_name,
          branch_name: data.branch_name,
          amount: deposit_amount,
          old_balance: data.old_balance,
          new_balance: data.new_balance,
          transaction_id: generateTransactionId()
        };
        
        // Show success message with download option
        showSuccessMessage(transactionData);
      } else {
        speak(data.message || "जमा विफल। कृपया पुनः प्रयास करें।");
        alert(data.message);
      }
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #4ade80; margin-bottom: 15px; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);">✅ जमा सफल!</h2>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">खाता:</strong> ${transactionData.account_number}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">नाम:</strong> ${transactionData.full_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">शाखा:</strong> ${transactionData.branch_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">जमा राशि:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">पुराना बैलेंस:</strong> ₹${transactionData.old_balance.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">नया बैलेंस:</strong> ₹${transactionData.new_balance.toLocaleString('en-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #4facfe; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              📥 रसीद डाउनलोड करें
            </button>
            <button id="closeModalBtn" 
                    style="background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              बंद करें
            </button>
          </div>
        </div>
      `;
      
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: rgba(15, 27, 46, 0.95); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(33, 150, 243, 0.3); border: 1px solid rgba(33, 150, 243, 0.3); color: white;';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    function downloadReceipt(transactionData) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('hi-IN', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      const timeStr = now.toLocaleTimeString('hi-IN', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });

      const receiptHTML = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transaction Receipt - ${transactionData.transaction_id}</title>
  <style>
    @media print { body { margin: 0; } .no-print { display: none; } }
    body { font-family: 'Arial', sans-serif; max-width: 600px; margin: 20px auto; padding: 30px; background: #f5f5f5; }
    .receipt-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { text-align: center; border-bottom: 3px solid #4facfe; padding-bottom: 20px; margin-bottom: 30px; }
    .bank-name { font-size: 28px; font-weight: bold; color: #4facfe; margin-bottom: 5px; }
    .bank-tagline { font-size: 14px; color: #666; }
    .receipt-title { text-align: center; font-size: 24px; font-weight: bold; color: #32CD32; margin: 20px 0; }
    .transaction-info { margin: 25px 0; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info-label { font-weight: bold; color: #333; }
    .info-value { color: #666; text-align: right; }
    .amount-row { background: #f0f8ff; padding: 15px; border-radius: 5px; margin: 20px 0; }
    .amount-label { font-size: 18px; font-weight: bold; color: #4facfe; }
    .amount-value { font-size: 24px; font-weight: bold; color: #32CD32; margin-top: 5px; }
    .balance-info { background: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
    .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; color: #999; font-size: 12px; }
    .transaction-id { background: #fff3cd; padding: 10px; border-radius: 5px; text-align: center; margin: 20px 0; font-family: 'Courier New', monospace; font-weight: bold; color: #856404; }
  </style>
</head>
<body>
  <div class="receipt-container">
    <div class="header">
      <div class="bank-name">🤖 AI Voice Banking</div>
      <div class="bank-tagline">आपका स्मार्ट बैंकिंग समाधान</div>
    </div>
    <div class="receipt-title">${transactionData.type_hi} रसीद</div>
    <div class="transaction-id">लेनदेन ID: ${transactionData.transaction_id}</div>
    <div class="transaction-info">
      <div class="info-row"><span class="info-label">खाता संख्या:</span><span class="info-value">${transactionData.account_number}</span></div>
      <div class="info-row"><span class="info-label">नाम:</span><span class="info-value">${transactionData.full_name}</span></div>
      <div class="info-row"><span class="info-label">शाखा:</span><span class="info-value">${transactionData.branch_name}</span></div>
      <div class="info-row"><span class="info-label">दिनांक:</span><span class="info-value">${dateStr}</span></div>
      <div class="info-row"><span class="info-label">समय:</span><span class="info-value">${timeStr}</span></div>
    </div>
    <div class="amount-row">
      <div class="amount-label">जमा राशि</div>
      <div class="amount-value">₹${transactionData.amount.toLocaleString('en-IN')}</div>
    </div>
    <div class="balance-info">
      <div class="info-row"><span class="info-label">पुराना बैलेंस:</span><span class="info-value">₹${transactionData.old_balance.toLocaleString('en-IN')}</span></div>
      <div class="info-row"><span class="info-label">नया बैलेंस:</span><span class="info-value">₹${transactionData.new_balance.toLocaleString('en-IN')}</span></div>
    </div>
    <div class="footer">
      <p>धन्यवाद! आपका लेनदेन सफल रहा।</p>
      <p>यह एक कंप्यूटर जनित रसीद है और हस्ताक्षर की आवश्यकता नहीं है।</p>
    </div>
  </div>
</body>
</html>`;

      const blob = new Blob([receiptHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Receipt_${transactionData.transaction_id}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #4facfe; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      speak("सुन रहा हूं। कृपया अपनी खाता संख्या और राशि बताएं।");
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
