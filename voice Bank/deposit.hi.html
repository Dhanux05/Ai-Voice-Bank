<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>जमा करें - एआई वॉयस बैंकिंग</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">💰 जमा करें</h1>
    <p class="subtitle">पैसा जमा करने के लिए विवरण भरें</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>खाता संख्या (12 अंक)</label>
      </div>

      <div class="input-group">
        <input type="number" id="depositAmount" required>
        <label>जमा राशि (₹)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ जमा करें</button>
      <a href="index.html" class="btn-back">⬅️ मेनू पर वापस जाएँ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("depositAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'hi-IN';
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
      isListening = true;
      recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        handleVoiceCommand(command);
      };
      recognition.onend = () => { isListening = false; };
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("depositAmount");
      const accountMatch = command.match(/(?:खाता|नंबर|account)\s*(\d+)|(\d{12})|(\d{4,12})/);
      if (accountMatch) {
        const accNum = accountMatch[1] || accountMatch[2];
        accountInput.value = accNum;
        speak(`खाता संख्या ${accNum} दर्ज की गई। कृपया जमा राशि बताएं।`);
        setTimeout(() => startListening(), 2000);
        return;
      }
      const amountMatch = command.match(/(\d+)\s*(?:रुपये|rupees|rs)/i) || command.match(/(\d+)/);
      if (amountMatch && accountInput.value) {
        const amount = amountMatch[1];
        amountInput.value = amount;
        speak(`राशि ${amount} रुपये दर्ज की गई। जमा प्रसंस्करण।`);
        setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        return;
      }
      if (command.includes('पांच सौ') || command.includes('500')) {
        amountInput.value = 500;
        speak("पांच सौ रुपये चुने गए");
      } else if (command.includes('एक हज़ार') || command.includes('1000')) {
        amountInput.value = 1000;
        speak("एक हज़ार रुपये चुने गए");
      } else if (command.includes('दो हज़ार') || command.includes('2000')) {
        amountInput.value = 2000;
        speak("दो हज़ार रुपये चुने गए");
      } else if (command.includes('पांच हज़ार') || command.includes('5000')) {
        amountInput.value = 5000;
        speak("पांच हज़ार रुपये चुने गए");
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        speak("जमा पृष्ठ पर आपका स्वागत है। कृपया अपनी खाता संख्या बताएं, फिर जमा राशि।");
        setTimeout(() => startListening(), 4000);
      }, 1000);
    });

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const deposit_amount = parseFloat(document.getElementById("depositAmount").value);
      if (!account_number || !deposit_amount) {
        speak("कृपया खाता संख्या और राशि दर्ज करें");
        return;
      }
      speak("आपकी जमा राशि प्रसंस्करण की जा रही है। कृपया प्रतीक्षा करें।");
      const response = await fetch("http://localhost:5000/deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_number, deposit_amount })
      });
      const data = await response.json();
      if (response.ok && data.new_balance !== undefined) {
        speak(`जमा सफल! आपका नया बैलेंस ${data.new_balance} रुपये है।`);
        alert(`जमा सफल!\n\nखाता: ${data.account_number}\nनाम: ${data.full_name}\nशाखा: ${data.branch_name}\nपुराना बैलेंस: ₹${data.old_balance}\nनया बैलेंस: ₹${data.new_balance}`);
      } else {
        speak(data.message || "जमा विफल। कृपया पुनः प्रयास करें।");
        alert(data.message);
      }
    });

    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #4facfe; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      speak("सुन रहा हूं। कृपया अपनी खाता संख्या और राशि बताएं।");
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
