<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Account Management</title>
  <link rel="stylesheet" href="style2.css">
  <style>
    body {
      overflow-y: auto !important;
      overflow-x: hidden !important;
      height: auto !important;
      min-height: 100vh;
    }
    html {
      overflow-y: auto !important;
      height: auto !important;
    }
    .admin-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      position: relative;
      z-index: 10;
    }
    .admin-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .admin-card {
      background: rgba(15, 27, 46, 0.85);
      backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(33, 150, 243, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(33, 150, 243, 0.3);
      margin-bottom: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(33, 150, 243, 0.1);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid rgba(33, 150, 243, 0.2);
      text-align: center;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: bold;
      color: #4caf50;
      margin: 10px 0;
    }
    .stat-label {
      color: #b0bec5;
      font-size: 0.9rem;
    }
    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .users-table th,
    .users-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(33, 150, 243, 0.2);
      color: #ffffff;
    }
    .users-table th {
      background: rgba(33, 150, 243, 0.2);
      color: #ffffff;
      font-weight: 600;
    }
    .users-table tr:hover {
      background: rgba(33, 150, 243, 0.05);
    }
    .action-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-small {
      padding: 8px 15px;
      font-size: 0.9rem;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-edit {
      background: #4facfe;
      color: white;
    }
    .btn-delete {
      background: #ff6b6b;
      color: white;
    }
    .btn-small:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: rgba(15, 27, 46, 0.95);
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(33, 150, 243, 0.3);
      border: 1px solid rgba(33, 150, 243, 0.3);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #b0bec5;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(33, 150, 243, 0.4);
      border-radius: 8px;
      background: rgba(10, 25, 41, 0.7);
      color: #ffffff;
      font-size: 1rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: rgba(33, 150, 243, 0.8);
      box-shadow: 0 0 10px rgba(33, 150, 243, 0.3);
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(33, 150, 243, 0.4);
      border-radius: 8px;
      background: rgba(10, 25, 41, 0.7);
      color: #ffffff;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  
  <div class="admin-container">
    <div class="admin-header">
      <h1 class="title">🔐 Admin Panel</h1>
      <p class="subtitle">Account Management System</p>
    </div>

    <!-- Statistics -->
    <div class="admin-card">
      <h2 style="color: #ffffff; margin-bottom: 20px;">📊 Statistics</h2>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-label">Total Accounts</div>
          <div class="stat-value" id="totalAccounts">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Balance</div>
          <div class="stat-value" id="totalBalance">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Average Balance</div>
          <div class="stat-value" id="avgBalance">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Transactions</div>
          <div class="stat-value" id="totalTransactions">-</div>
        </div>
      </div>
    </div>

    <!-- Users List -->
    <div class="admin-card">
      <h2 style="color: #ffffff; margin-bottom: 20px;">👥 All Users</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by account number, name, or branch..." onkeyup="filterUsers()">
      </div>
      <div style="overflow-x: auto;">
        <table class="users-table">
          <thead>
            <tr>
              <th>Account Number</th>
              <th>Name</th>
              <th>Branch</th>
              <th>Balance</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="7" style="text-align: center; padding: 20px; color: #b0bec5;">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2 style="color: #ffffff; margin-bottom: 20px;">✏️ Edit Account</h2>
      <form id="editForm">
        <input type="hidden" id="editAccountNumber">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="editFullName" required>
        </div>
        <div class="form-group">
          <label>Branch Name</label>
          <input type="text" id="editBranchName" required>
        </div>
        <div class="form-group">
          <label>Balance (₹)</label>
          <input type="number" id="editBalance" step="0.01" min="0" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="editEmail">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="editPhone">
        </div>
        <div class="form-group">
          <label>PIN (4 digits)</label>
          <input type="text" id="editPin" maxlength="4" pattern="[0-9]{4}">
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn btn-dark" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-cyan">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allUsers = [];

    // Load statistics
    async function loadStats() {
      try {
        const response = await fetch('http://localhost:5000/api/admin/stats');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('totalAccounts').textContent = data.accounts.total || 0;
          document.getElementById('totalBalance').textContent = '₹' + (data.accounts.total_balance || 0).toLocaleString('en-IN');
          document.getElementById('avgBalance').textContent = '₹' + (data.accounts.average_balance || 0).toLocaleString('en-IN');
          document.getElementById('totalTransactions').textContent = data.transactions.total || 0;
        } else {
          console.error('Stats error:', data.error || 'Unknown error');
          showError('Error loading statistics');
        }
      } catch (error) {
        console.error('Error loading stats:', error);
        showError('Failed to load statistics. Make sure server is running on http://localhost:5000');
      }
    }

    // Load all users
    async function loadUsers() {
      try {
        const response = await fetch('http://localhost:5000/api/admin/users');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        
        if (data.success) {
          allUsers = data.users || [];
          displayUsers(allUsers);
        } else {
          throw new Error(data.error || 'Failed to load users');
        }
      } catch (error) {
        console.error('Error loading users:', error);
        document.getElementById('usersTableBody').innerHTML = 
          '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #ff6b6b;">Error loading users: ' + error.message + '<br>Make sure server is running on http://localhost:5000</td></tr>';
      }
    }
    
    // Show error message
    function showError(message) {
      console.error(message);
      // You could add a toast notification here
      alert(message);
    }

    // Display users in table
    function displayUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 20px; color: #b0bec5;">No users found</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(user => `
        <tr>
          <td>${user.account_number}</td>
          <td>${user.full_name}</td>
          <td>${user.branch_name}</td>
          <td>₹${parseFloat(user.balance).toLocaleString('en-IN')}</td>
          <td>${user.email || '-'}</td>
          <td>${user.phone || '-'}</td>
          <td>
            <div class="action-buttons">
              <button class="btn-small btn-edit" onclick="editUser(${user.account_number})">Edit</button>
              <button class="btn-small btn-delete" onclick="deleteUser(${user.account_number})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Filter users
    function filterUsers() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allUsers.filter(user => 
        user.account_number.toString().includes(searchTerm) ||
        user.full_name.toLowerCase().includes(searchTerm) ||
        (user.branch_name && user.branch_name.toLowerCase().includes(searchTerm))
      );
      displayUsers(filtered);
    }

    // Edit user
    async function editUser(accountNumber) {
      try {
        const response = await fetch(`http://localhost:5000/api/admin/users/${accountNumber}`);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        
        if (data.success && data.user) {
          const user = data.user;
          document.getElementById('editAccountNumber').value = user.account_number;
          document.getElementById('editFullName').value = user.full_name || '';
          document.getElementById('editBranchName').value = user.branch_name || '';
          document.getElementById('editBalance').value = user.balance || 0;
          document.getElementById('editEmail').value = user.email || '';
          document.getElementById('editPhone').value = user.phone || '';
          document.getElementById('editPin').value = '';
          document.getElementById('editModal').style.display = 'flex';
        } else {
          throw new Error(data.error || 'Failed to load user');
        }
      } catch (error) {
        console.error('Error loading user:', error);
        alert('Error loading user details: ' + error.message);
      }
    }

    // Close edit modal
    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    // Handle edit form submission
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const accountNumber = document.getElementById('editAccountNumber').value;
      const fullName = document.getElementById('editFullName').value;
      const branchName = document.getElementById('editBranchName').value;
      const balance = parseFloat(document.getElementById('editBalance').value);
      const email = document.getElementById('editEmail').value;
      const phone = document.getElementById('editPhone').value;
      const pin = document.getElementById('editPin').value;

      try {
        // Update balance separately
        const balanceResponse = await fetch(`http://localhost:5000/api/admin/users/${accountNumber}/balance`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ balance })
        });
        
        if (!balanceResponse.ok) {
          const errorData = await balanceResponse.json();
          throw new Error(errorData.error || 'Failed to update balance');
        }
        
        const balanceData = await balanceResponse.json();
        if (!balanceData.success) {
          throw new Error(balanceData.error || 'Failed to update balance');
        }

        // Update other fields
        const updateData = {
          full_name: fullName,
          branch_name: branchName,
          email: email || null,
          phone: phone || null
        };
        
        if (pin) {
          updateData.pin = pin;
        }

        const response = await fetch(`http://localhost:5000/api/admin/users/${accountNumber}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });
        
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to update account');
        }
        
        const data = await response.json();
        if (data.success) {
          alert('Account updated successfully!');
          closeEditModal();
          loadUsers();
          loadStats();
        } else {
          throw new Error(data.error || 'Failed to update account');
        }
      } catch (error) {
        console.error('Error updating user:', error);
        alert('Error: ' + error.message);
      }
    });

    // Delete user
    async function deleteUser(accountNumber) {
      if (!confirm(`Are you sure you want to delete account ${accountNumber}? This action cannot be undone!`)) {
        return;
      }

      try {
        const response = await fetch(`http://localhost:5000/api/admin/users/${accountNumber}`, {
          method: 'DELETE'
        });
        
        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to delete account');
        }
        
        const data = await response.json();
        if (data.success) {
          alert('Account deleted successfully!');
          loadUsers();
          loadStats();
        } else {
          throw new Error(data.error || 'Failed to delete account');
        }
      } catch (error) {
        console.error('Error deleting user:', error);
        alert('Error: ' + error.message);
      }
    }

    // Close modal on outside click
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target.id === 'editModal') {
        closeEditModal();
      }
    });

    // Load data on page load
    window.addEventListener('load', () => {
      console.log('Admin page loaded, fetching data...');
      loadStats();
      loadUsers();
    });
    
    // Test server connection
    async function testServerConnection() {
      try {
        const response = await fetch('http://localhost:5000/api/admin/stats');
        console.log('Server response status:', response.status);
        if (response.ok) {
          console.log('✅ Server is reachable');
        } else {
          console.error('❌ Server returned error:', response.status);
        }
      } catch (error) {
        console.error('❌ Cannot reach server:', error);
        alert('Cannot connect to server. Make sure the server is running on http://localhost:5000\n\nRun: node servar.js');
      }
    }
    
    // Test connection on load
    testServerConnection();
  </script>
</body>
</html>
