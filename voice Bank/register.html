<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI Voice Banking</title>
  <link rel="stylesheet" href="style2.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .register-card {
      background: rgba(255, 182, 193, 0.15);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 450px;
      margin: 0 auto;
    }
    .register-title {
      font-size: 2rem;
      font-weight: 700;
      color: #FFB6C1;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
      margin-bottom: 30px;
    }
    .register-input {
      width: 100%;
      padding: 15px 20px;
      margin-bottom: 20px;
      border: 2px solid rgba(255, 182, 193, 0.3);
      border-radius: 12px;
      background: rgba(255, 192, 203, 0.2);
      color: white;
      font-size: 16px;
      transition: all 0.3s;
    }
    .register-input:focus {
      outline: none;
      border-color: #FFB6C1;
      box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
      background: rgba(255, 192, 203, 0.3);
    }
    .register-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    .register-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #90EE90, #32CD32);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(144, 238, 144, 0.4);
      transition: all 0.3s;
      margin-bottom: 15px;
    }
    .register-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(144, 238, 144, 0.6);
    }
    .back-btn {
      width: 100%;
      padding: 12px;
      background: rgba(128, 0, 128, 0.6);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: rgba(128, 0, 128, 0.8);
    }
    .login-link {
      margin-top: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }
    .login-link a {
      color: #4facfe;
      text-decoration: underline;
      cursor: pointer;
    }
    .result-card {
      margin-top: 20px;
      background: rgba(255, 182, 193, 0.2);
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <div class="register-card fade-in">
      <h2 class="register-title">Register</h2>
      
      <form id="registerForm">
        <input type="text" class="register-input" id="fullName" placeholder="Full Name" required>
        <input type="tel" class="register-input" id="phone" placeholder="Mobile Number" pattern="[0-9]{10}" maxlength="10">
        <input type="text" class="register-input" id="accountNumber" placeholder="Account Number (Enter 4-12 digits)" maxlength="12" pattern="[0-9]{4,12}" required>
        <input type="password" class="register-input" id="pin" placeholder="4-digit PIN" maxlength="4" pattern="[0-9]{4}" required>
        
        <button type="submit" class="register-btn">Register</button>
        <a href="index.html" class="back-btn">
          <span>⬅️</span>
          <span>Back to Dashboard</span>
        </a>
        
        <div class="login-link">
          Already registered? <a href="login.html">Login here</a>
        </div>
      </form>

      <div id="result" class="card hidden fade-in result-card"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const resultDiv = document.getElementById("result");
    // Get stored language or default to English
    const storedLang = sessionStorage.getItem('selectedLanguage') || 'en';
    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = storedLang === 'hi' ? 'hi-IN' : storedLang === 'kn' ? 'kn-IN' : 'en-US';
    }
    
    // Update page text based on language
    const langTexts = {
      en: {
        title: "Register",
        namePlaceholder: "Full Name",
        phonePlaceholder: "Mobile Number",
        accountPlaceholder: "Account Number (Enter 4-12 digits)",
        pinPlaceholder: "4-digit PIN",
        button: "Register",
        back: "Back to Dashboard",
        loginLink: "Already registered?",
        login: "Login here",
        welcome: "Welcome to registration page. Please fill in your details or say them aloud."
      },
      hi: {
        title: "पंजीकरण",
        namePlaceholder: "पूरा नाम",
        phonePlaceholder: "मोबाइल नंबर",
        accountPlaceholder: "खाता संख्या (4-12 अंक दर्ज करें)",
        pinPlaceholder: "4 अंकों का PIN",
        button: "पंजीकरण करें",
        back: "डैशबोर्ड पर वापस जाएँ",
        loginLink: "पहले से पंजीकृत हैं?",
        login: "यहाँ लॉगिन करें",
        welcome: "पंजीकरण पृष्ठ पर स्वागत है। कृपया अपना विवरण भरें या जोर से बोलें।"
      },
      kn: {
        title: "ನೋಂದಣಿ",
        namePlaceholder: "ಪೂರ್ಣ ಹೆಸರು",
        phonePlaceholder: "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ",
        accountPlaceholder: "ಖಾತೆ ಸಂಖ್ಯೆ (4-12 ಅಂಕೆಗಳನ್ನು ನಮೂದಿಸಿ)",
        pinPlaceholder: "4 ಅಂಕೆಗಳ PIN",
        button: "ನೋಂದಣಿ ಮಾಡಿ",
        back: "ಡ್ಯಾಶ್ಬೋರ್ಡ್ಗೆ ಹಿಂತಿರುಗಿ",
        loginLink: "ಈಗಾಗಲೇ ನೋಂದಾಯಿಸಲಾಗಿದೆಯೇ?",
        login: "ಇಲ್ಲಿ ಲಾಗಿನ್ ಮಾಡಿ",
        welcome: "ನೋಂದಣಿ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ ಅಥವಾ ಅವುಗಳನ್ನು ಜೋರಾಗಿ ಹೇಳಿ."
      }
    };
    
    // Update page content based on language
    function updatePageLanguage(lang) {
      const texts = langTexts[lang] || langTexts.en;
      document.querySelector('.register-title').innerText = texts.title;
      document.getElementById('fullName').placeholder = texts.namePlaceholder;
      document.getElementById('phone').placeholder = texts.phonePlaceholder;
      document.getElementById('accountNumber').placeholder = texts.accountPlaceholder;
      document.getElementById('pin').placeholder = texts.pinPlaceholder;
      document.querySelector('.register-btn').innerText = texts.button;
      document.querySelector('.back-btn span:last-child').innerText = texts.back;
      const loginLink = document.querySelector('.login-link');
      if (loginLink) {
        loginLink.innerHTML = `${texts.loginLink} <a href="login.html">${texts.login}</a>`;
      }
    }
    
    // Apply language on page load
    if (storedLang !== 'en') {
      updatePageLanguage(storedLang);
    }

    function speak(text, lang = storedLang) {
      const voices = speechSynthesis.getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (lang === 'hi') {
        const hindiVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('hi') || 
          v.lang.toLowerCase().includes('hindi') || 
          v.name.toLowerCase().includes('hindi') ||
          v.lang === 'hi-IN' || v.lang === 'hi'
        );
        utterance.lang = 'hi-IN';
        if (hindiVoice) utterance.voice = hindiVoice;
      } else if (lang === 'kn') {
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' || v.lang === 'kn'
        );
        utterance.lang = 'kn-IN';
        if (kannadaVoice) utterance.voice = kannadaVoice;
      } else {
        utterance.lang = 'en-US';
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      try {
        recognition.stop();
      } catch(e) {}
      
      recognition.onresult = (event) => {
        if (event.results.length > 0) {
          const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
          console.log("Heard:", command);
          handleVoiceCommand(command);
        }
      };
      
      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          alert("Microphone permission denied");
          isListening = false;
        } else if (event.error !== 'aborted' && event.error !== 'no-speech') {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e) {}
            }
          }, 1000);
        }
      };
      
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            try { recognition.start(); } catch(e) {}
          }, 500);
        }
      };
      
      try {
        recognition.start();
        isListening = true;
      } catch(e) {
        console.log("Error:", e);
      }
    }

    function handleVoiceCommand(command) {
      // Voice command handling for registration
      const nameInput = document.getElementById("fullName");
      const phoneInput = document.getElementById("phone");
      const accountInput = document.getElementById("accountNumber");
      const pinInput = document.getElementById("pin");
      
      // Extract name
      if (!nameInput.value && command.includes('name is') || command.includes('my name')) {
        const nameMatch = command.match(/name is (\w+)/i) || command.match(/my name (\w+)/i);
        if (nameMatch) {
          nameInput.value = nameMatch[1];
          speak(`Name ${nameMatch[1]} entered.`);
        }
      }
      
      // Extract phone
      const phoneMatch = command.match(/(\d{10})/);
      if (phoneMatch && !phoneInput.value) {
        phoneInput.value = phoneMatch[1];
        speak(`Phone number entered.`);
      }
      
      // Extract account number
      const accountMatch = command.match(/(?:account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
      if (accountMatch && !accountInput.value) {
        const accNum = accountMatch[1] || accountMatch[2] || accountMatch[3];
        accountInput.value = accNum;
        speak(`Account number ${accNum} entered.`);
      }
      
      // Extract PIN
      const pinMatch = command.match(/(\d{4})/);
      if (pinMatch && !pinInput.value) {
        const pin = pinMatch[1];
        pinInput.value = pin;
        speak(`PIN entered.`);
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        speak("Welcome to registration page. Please fill in your details or say them aloud.");
        setTimeout(() => startListening(), 3000);
      }, 1000);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }

      const full_name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const account_number = document.getElementById("accountNumber").value.trim();
      const pin = document.getElementById("pin").value;

      console.log("=== REGISTRATION FORM VALUES ===");
      console.log("Account number input (raw):", document.getElementById("accountNumber").value);
      console.log("Account number (trimmed):", account_number);
      console.log("Account number length:", account_number.length);

      if (!full_name || !pin) {
        speak("Please enter full name and PIN");
        return;
      }

      // Account number is now required
      if (!account_number || account_number.trim() === '') {
        const msg = storedLang === 'hi'
          ? "कृपया खाता संख्या दर्ज करें"
          : storedLang === 'kn'
          ? "ದಯವಿಟ್ಟು ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ"
          : "Please enter account number";
        speak(msg, storedLang);
        alert(msg);
        document.getElementById("accountNumber").focus();
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        speak("PIN must be exactly 4 digits");
        return;
      }

      // Clean and validate account number if provided
      let cleanAccountNumber = null;
      if (account_number && account_number.trim() !== '') {
        console.log("Account number provided, cleaning...");
        cleanAccountNumber = account_number.replace(/\D/g, ''); // Remove non-numeric
        console.log("Cleaned account number:", cleanAccountNumber, "Length:", cleanAccountNumber.length);
        
        if (cleanAccountNumber.length < 4 || cleanAccountNumber.length > 12) {
          console.log("ERROR: Account number length validation failed");
          const msg = storedLang === 'hi'
            ? "खाता संख्या 4 से 12 अंकों के बीच होनी चाहिए"
            : storedLang === 'kn'
            ? "ಖಾತೆ ಸಂಖ್ಯೆ 4 ರಿಂದ 12 ಅಂಕೆಗಳ ನಡುವೆ ಇರಬೇಕು"
            : "Account number must be between 4 and 12 digits";
          speak(msg, storedLang);
          return;
        }
        console.log("✅ Account number validation passed");
      } else {
        console.log("⚠️ No account number provided in input field");
      }

      speak("Processing your registration. Please wait.");

      try {
        // Prepare request body with optional account number
        const requestBody = {
          full_name,
          branch_name: "Main Branch", // Default branch
          initial_balance: 0,
          pin,
          phone: phone || null,
          email: null
        };

        // Account number is REQUIRED - must be included in request
        if (!cleanAccountNumber || cleanAccountNumber.length === 0) {
          const msg = storedLang === 'hi'
            ? "कृपया खाता संख्या दर्ज करें"
            : storedLang === 'kn'
            ? "ದಯವಿಟ್ಟು ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ"
            : "Please enter account number";
          speak(msg, storedLang);
          alert(msg);
          document.getElementById("accountNumber").focus();
          return;
        }

        // ALWAYS include account_number in request body (it's required)
        requestBody.account_number = String(cleanAccountNumber); // Ensure it's a string
        
        console.log("=== PREPARING REQUEST BODY ===");
        console.log("cleanAccountNumber value:", cleanAccountNumber);
        console.log("cleanAccountNumber type:", typeof cleanAccountNumber);
        console.log("cleanAccountNumber length:", cleanAccountNumber.length);
        console.log("✅ ADDING account_number to request body:", requestBody.account_number);

        console.log("=== FINAL REQUEST BODY ===");
        console.log("Request body:", JSON.stringify(requestBody, null, 2));
        console.log("Has account_number key?", 'account_number' in requestBody);
        console.log("account_number value in requestBody:", requestBody.account_number);
        console.log("account_number type in requestBody:", typeof requestBody.account_number);

        const response = await fetch("http://localhost:5000/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestBody)
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.classList.remove("hidden");
          resultDiv.innerHTML = `
            <h2 style="color: #4ade80;">✅ Registration Successful!</h2>
            <p><strong>Account Number:</strong> ${data.account_number}</p>
            <p><strong>Name:</strong> ${data.full_name}</p>
            <p><strong>Branch:</strong> ${data.branch_name}</p>
            <p><strong>Initial Balance:</strong> ₹${data.balance}</p>
            <p style="color: #fbbf24; margin-top: 10px;"><strong>⚠️ Please note your Account Number and PIN!</strong></p>
            <p style="margin-top: 15px;"><a href="login.html" style="color: #4facfe; text-decoration: underline;">Click here to login</a></p>
          `;
          const successMsg = storedLang === 'hi' 
            ? `पंजीकरण सफल! आपकी खाता संख्या ${data.account_number} है। कृपया इसे नोट करें। 5 सेकंड में लॉगिन पृष्ठ पर रीडायरेक्ट हो रहे हैं।`
            : storedLang === 'kn'
            ? `ನೋಂದಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆ ${data.account_number} ಆಗಿದೆ। ದಯವಿಟ್ಟು ಇದನ್ನು ನೋಂದಾಯಿಸಿ। 5 ಸೆಕೆಂಡುಗಳಲ್ಲಿ ಲಾಗಿನ್ ಪುಟಕ್ಕೆ ಮರುನಿರ್ದೇಶಿಸಲಾಗುತ್ತಿದೆ।`
            : `Registration successful! Your account number is ${data.account_number}. Please note it down. Redirecting to login page in 5 seconds.`;
          speak(successMsg, storedLang);
          // Preserve selected language
          sessionStorage.setItem('selectedLanguage', storedLang);
          form.reset();
          setTimeout(() => {
            window.location.href = "login.html";
          }, 5000);
        } else {
          const errorMsg = storedLang === 'hi'
            ? (data.message || "पंजीकरण विफल")
            : storedLang === 'kn'
            ? (data.message || "ನೋಂದಣಿ ವಿಫಲವಾಗಿದೆ")
            : (data.message || "Registration failed");
          speak(errorMsg, storedLang);
          alert(data.message || "Registration failed");
        }
      } catch (error) {
        speak("Server not reachable. Please check your connection.");
        alert("❌ Server not reachable. Please make sure the server is running.");
        console.error("Error:", error);
      }
    });

    // Microphone button
    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #FFB6C1; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (isListening) {
        recognition.stop();
        isListening = false;
        micBtn.style.background = '#FFB6C1';
      } else {
        speak("Listening. Please say your details.");
        micBtn.style.background = '#ff6b6b';
        setTimeout(() => startListening(), 1000);
      }
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
