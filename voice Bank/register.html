<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - AI Voice Banking</title>
  <link rel="stylesheet" href="style2.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">📝 Register New Account</h1>
    <p class="subtitle">Fill in the details to create your account</p>

    <form class="form-card fade-in" id="registerForm">
      <div class="input-group">
        <input type="text" id="fullName" required>
        <label>Full Name</label>
      </div>

      <div class="input-group">
        <input type="text" id="branchName" required>
        <label>Branch Name</label>
      </div>

      <div class="input-group">
        <input type="number" id="initialBalance" min="0" value="0">
        <label>Initial Balance (₹) - Optional</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 digits)</label>
      </div>

      <div class="input-group">
        <input type="email" id="email">
        <label>Email - Optional</label>
      </div>

      <div class="input-group">
        <input type="tel" id="phone" pattern="[0-9]{10}">
        <label>Phone Number - Optional</label>
      </div>

      <button type="submit" class="btn-submit">✅ Register</button>
      <a href="index.html" class="btn-back">⬅️ Back to Home</a>
    </form>

    <div id="result" class="card hidden fade-in" style="margin-top: 20px;"></div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const resultDiv = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const full_name = document.getElementById("fullName").value.trim();
      const branch_name = document.getElementById("branchName").value.trim();
      const initial_balance = document.getElementById("initialBalance").value || 0;
      const pin = document.getElementById("pin").value;
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        alert("PIN must be exactly 4 digits");
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name,
            branch_name,
            initial_balance: parseFloat(initial_balance),
            pin,
            email: email || null,
            phone: phone || null
          })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.classList.remove("hidden");
          resultDiv.innerHTML = `
            <h2 style="color: #4ade80;">✅ Registration Successful!</h2>
            <p><strong>Account Number:</strong> ${data.account_number}</p>
            <p><strong>Name:</strong> ${data.full_name}</p>
            <p><strong>Branch:</strong> ${data.branch_name}</p>
            <p><strong>Initial Balance:</strong> ₹${data.balance}</p>
            <p style="color: #fbbf24; margin-top: 10px;"><strong>⚠️ Please note your Account Number and PIN!</strong></p>
          `;
          form.reset();
        } else {
          alert(data.message || "Registration failed");
        }
      } catch (error) {
        alert("❌ Server not reachable. Please make sure the server is running.");
        console.error("Error:", error);
      }
    });
  </script>
</body>
</html>
