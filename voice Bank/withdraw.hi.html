<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>निकासी - एआई वॉयस बैंकिंग</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">📉 पैसा निकालें</h1>
    <p class="subtitle">पैसा निकालने के लिए विवरण भरें</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>खाता संख्या (12 अंक)</label>
      </div>

      <div class="input-group">
        <input type="number" id="withdrawAmount" required>
        <label>निकासी राशि (₹)</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 अंक)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ निकालें</button>
      <a href="index.html" class="btn-back">⬅️ मेनू पर वापस जाएँ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("withdrawAmount").value = button.dataset.value;
      });
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #ff6b6b; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);">✅ निकासी सफल!</h2>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">खाता:</strong> ${transactionData.account_number}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">नाम:</strong> ${transactionData.full_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">शाखा:</strong> ${transactionData.branch_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">निकासी राशि:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">पुराना बैलेंस:</strong> ₹${transactionData.old_balance.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">नया बैलेंस:</strong> ₹${transactionData.new_balance.toLocaleString('en-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #4facfe; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              📥 रसीद डाउनलोड करें
            </button>
            <button id="closeModalBtn" 
                    style="background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              बंद करें
            </button>
          </div>
        </div>
      `;
      
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: rgba(15, 27, 46, 0.95); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(33, 150, 243, 0.3); border: 1px solid rgba(33, 150, 243, 0.3); color: white;';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    function downloadReceipt(transactionData) {
      // Receipt download functionality - can be implemented later
      alert("रसीद डाउनलोड की जा रही है...");
    }

    function speak(text, lang = 'hi') {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'hi' ? 'hi-IN' : 'en-US';
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const withdraw_amount = parseFloat(document.getElementById("withdrawAmount").value);
      const pin = document.getElementById("pin").value;

      if (!account_number || !withdraw_amount || !pin) {
        alert("कृपया सभी फ़ील्ड भरें");
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        alert("PIN 4 अंकों का होना चाहिए");
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account_number, withdraw_amount, pin })
        });
        const data = await response.json();
        if (response.ok) {
          speak(`निकासी सफल! आपका नया बैलेंस ${data.new_balance} रुपये है।`, 'hi');
          
          // Store transaction data for receipt
          const transactionData = {
            type: 'Withdrawal',
            type_hi: 'निकासी',
            account_number: data.account_number,
            full_name: data.full_name,
            branch_name: data.branch_name,
            amount: data.withdraw_amount,
            old_balance: data.old_balance,
            new_balance: data.new_balance,
            transaction_id: generateTransactionId()
          };
          
          // Show success message with download option
          showSuccessMessage(transactionData);
          form.reset();
        } else {
          speak(data.message || "निकासी विफल", 'hi');
          alert(data.message || "निकासी विफल");
        }
      } catch (error) {
        alert("❌ सर्वर तक पहुंच नहीं सकी");
      }
    });
  </script>
</body>
</html>
