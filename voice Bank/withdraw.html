<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - AI Voice Banking</title>
  <link rel="stylesheet" href="style2.css">

  <style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #ff6b6b;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #ff3b3b;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">📉 Withdraw Money</h1>
    <p class="subtitle">Fill in the details to complete withdrawal</p>

    <form class="form-card fade-in">
      
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>Account Number (12 digits)</label>
      </div>
      
      <div class="input-group">
        <input type="number" id="withdrawAmount" required>
        <label>Withdraw Amount (₹)</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 digits)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ Withdraw</button>
      <a href="index.html" class="btn-back">⬅️ Back to Menu</a>
    </form>
  </div>

  <script>
    // Add event listeners to bubbles
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("withdrawAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    let voiceStep = 'account'; // account, amount, pin
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true; // Keep listening
      recognition.interimResults = false;
      recognition.lang = 'en-US';
    }

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) {
        alert("Speech recognition not supported. Please use Chrome or Edge browser.");
        return;
      }
      
      try {
        recognition.stop();
      } catch(e) {}
      
      recognition.continuous = true;
      recognition.onresult = (event) => {
        if (event.results.length > 0) {
          const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
          console.log("Heard:", command);
          handleVoiceCommand(command);
        }
      };
      
      recognition.onerror = (event) => {
        console.log("Recognition error:", event.error);
        if (event.error === 'not-allowed') {
          alert("Microphone permission denied. Please allow microphone access.");
          isListening = false;
        } else if (event.error === 'no-speech') {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e) {}
            }
          }, 1000);
        } else if (event.error !== 'aborted') {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e) {}
            }
          }, 1000);
        }
      };
      
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            try {
              recognition.start();
            } catch(e) {
              isListening = false;
            }
          }, 500);
        }
      };
      
      try {
        recognition.start();
        isListening = true;
        console.log("🎤 Listening started");
      } catch(e) {
        console.log("Error starting:", e);
        alert("Could not start voice recognition. Please check microphone permissions.");
      }
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("withdrawAmount");
      const pinInput = document.getElementById("pin");
      
      if (voiceStep === 'account') {
        const accountMatch = command.match(/(?:account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
        if (accountMatch) {
          const accNum = accountMatch[1] || accountMatch[2];
          accountInput.value = accNum;
          speak(`Account number ${accNum} entered. Please say the withdrawal amount.`);
          voiceStep = 'amount';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'amount') {
        const amountMatch = command.match(/(\d+)\s*(?:rupees|rupee|rs|amount)/i) || command.match(/(\d+)/);
        if (amountMatch) {
          const amount = amountMatch[1];
          amountInput.value = amount;
          speak(`Amount ${amount} rupees entered. Please say your four digit PIN.`);
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('five hundred') || command.includes('500')) {
          amountInput.value = 500;
          speak("Five hundred rupees selected. Please say your PIN.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('one thousand') || command.includes('1000')) {
          amountInput.value = 1000;
          speak("One thousand rupees selected. Please say your PIN.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('two thousand') || command.includes('2000')) {
          amountInput.value = 2000;
          speak("Two thousand rupees selected. Please say your PIN.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('five thousand') || command.includes('5000')) {
          amountInput.value = 5000;
          speak("Five thousand rupees selected. Please say your PIN.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'pin') {
        const pinMatch = command.match(/(\d{4})/);
        if (pinMatch) {
          const pin = pinMatch[1];
          pinInput.value = pin;
          speak(`PIN entered. Processing withdrawal.`);
          setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        } else {
          speak("Please say your four digit PIN clearly.");
          setTimeout(() => startListening(), 2000);
        }
      }
    }

    // Speak on page load
    window.addEventListener('load', () => {
      setTimeout(() => {
        speak("Welcome to withdrawal page. Please say your account number first.");
        setTimeout(() => startListening(), 3000);
      }, 1000);
    });

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();

      const account_number = form.querySelector("input[type='text']").value.trim();
      const withdraw_amount = parseFloat(document.getElementById("withdrawAmount").value);
      const pin = document.getElementById("pin").value;

      if (!account_number || !withdraw_amount || !pin) {
        speak("Please fill in all fields");
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        speak("PIN must be exactly 4 digits");
        return;
      }

      speak("Processing your withdrawal. Please wait.");

      try {
        const response = await fetch("http://localhost:5000/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account_number, withdraw_amount, pin })
        });

        const data = await response.json();
        
        if (response.ok) {
          speak(`Withdrawal successful! Your new balance is ${data.new_balance} rupees.`);
          
          // Store transaction data for receipt
          const transactionData = {
            type: 'Withdrawal',
            account_number: data.account_number,
            full_name: data.full_name,
            branch_name: data.branch_name,
            amount: data.withdraw_amount,
            old_balance: data.old_balance,
            new_balance: data.new_balance,
            transaction_id: generateTransactionId()
          };
          
          // Show success message with download option
          showSuccessMessage(transactionData);
          form.reset();
          voiceStep = 'account';
        } else {
          speak(data.message || "Withdrawal failed. Please try again.");
          alert(data.message || "Withdrawal failed");
          voiceStep = 'account';
        }
      } catch (error) {
        speak("Server not reachable. Please make sure the server is running.");
        alert("❌ Server not reachable. Please make sure the server is running.");
        console.error("Error:", error);
      }
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      // Store transaction data globally
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #4caf50; margin-bottom: 15px; text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);">✅ Withdrawal Successful!</h2>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">Account:</strong> ${transactionData.account_number}</p>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">Name:</strong> ${transactionData.full_name}</p>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">Branch:</strong> ${transactionData.branch_name}</p>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">Withdrawn Amount:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">Old Balance:</strong> ₹${transactionData.old_balance.toLocaleString('en-IN')}</p>
          <p style="color: #ffffff;"><strong style="color: #b0bec5;">New Balance:</strong> ₹${transactionData.new_balance.toLocaleString('en-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #ff6b6b; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);">
              📥 Download Receipt
            </button>
            <button id="closeModalBtn" 
                    style="background: #424242; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              Close
            </button>
          </div>
        </div>
      `;
      
      // Create modal overlay
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: rgba(15, 27, 46, 0.95); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(33, 150, 243, 0.3); border: 1px solid rgba(33, 150, 243, 0.3);';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      // Add event listeners after DOM is ready
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      // Close on outside click
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    // Close success message
    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    // Download Receipt Function
    function downloadReceipt(transactionData) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-IN', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      const timeStr = now.toLocaleTimeString('en-IN', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });

      const receiptHTML = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transaction Receipt - ${transactionData.transaction_id}</title>
  <style>
    @media print {
      body { margin: 0; }
      .no-print { display: none; }
    }
    body {
      font-family: 'Arial', sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 30px;
      background: #f5f5f5;
    }
    .receipt-container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      border-bottom: 3px solid #ff6b6b;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .bank-name {
      font-size: 28px;
      font-weight: bold;
      color: #ff6b6b;
      margin-bottom: 5px;
    }
    .bank-tagline {
      font-size: 14px;
      color: #666;
    }
    .receipt-title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #ff6b6b;
      margin: 20px 0;
    }
    .transaction-info {
      margin: 25px 0;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .info-label {
      font-weight: bold;
      color: #333;
    }
    .info-value {
      color: #666;
      text-align: right;
    }
    .amount-row {
      background: #fff0f0;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    .amount-label {
      font-size: 18px;
      font-weight: bold;
      color: #ff6b6b;
    }
    .amount-value {
      font-size: 24px;
      font-weight: bold;
      color: #ff6b6b;
      margin-top: 5px;
    }
    .balance-info {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed #ccc;
      color: #999;
      font-size: 12px;
    }
    .transaction-id {
      background: #fff3cd;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      margin: 20px 0;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #856404;
    }
    .print-btn {
      text-align: center;
      margin-top: 20px;
    }
    .print-btn button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .print-btn button:hover {
      background: #ff3b3b;
    }
  </style>
</head>
<body>
  <div class="receipt-container">
    <div class="header">
      <div class="bank-name">🤖 AI Voice Banking</div>
      <div class="bank-tagline">Your Smart Banking Solution</div>
    </div>
    
    <div class="receipt-title">${transactionData.type} Receipt</div>
    
    <div class="transaction-id">
      Transaction ID: ${transactionData.transaction_id}
    </div>
    
    <div class="transaction-info">
      <div class="info-row">
        <span class="info-label">Date:</span>
        <span class="info-value">${dateStr}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Time:</span>
        <span class="info-value">${timeStr}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Account Number:</span>
        <span class="info-value">${transactionData.account_number}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Account Holder:</span>
        <span class="info-value">${transactionData.full_name}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Branch:</span>
        <span class="info-value">${transactionData.branch_name}</span>
      </div>
    </div>
    
    <div class="amount-row">
      <div class="amount-label">${transactionData.type} Amount</div>
      <div class="amount-value">₹${transactionData.amount.toLocaleString('en-IN')}</div>
    </div>
    
    <div class="balance-info">
      <div class="info-row">
        <span class="info-label">Previous Balance:</span>
        <span class="info-value">₹${transactionData.old_balance.toLocaleString('en-IN')}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Current Balance:</span>
        <span class="info-value" style="font-weight: bold; color: #32CD32;">₹${transactionData.new_balance.toLocaleString('en-IN')}</span>
      </div>
    </div>
    
    <div class="footer">
      <p>This is a computer-generated receipt.</p>
      <p>Thank you for banking with us!</p>
      <p style="margin-top: 10px;">For queries, contact: support@aivoicebank.com</p>
    </div>
    
    <div class="print-btn no-print">
      <button onclick="window.print()">🖨️ Print Receipt</button>
    </div>
  </div>
</body>
</html>`;

      // Create blob and download
      const blob = new Blob([receiptHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Receipt_${transactionData.transaction_id}_${transactionData.type}.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      // Close modal after download
      closeSuccessMessage();
      speak("Receipt downloaded successfully.");
    }

    // Microphone button
    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #ff6b6b; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (voiceStep === 'account') {
        speak("Please say your account number.");
      } else if (voiceStep === 'amount') {
        speak("Please say the withdrawal amount.");
      } else {
        speak("Please say your four digit PIN.");
      }
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
