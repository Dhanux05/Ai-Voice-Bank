<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಹಣ ವರ್ಗಾವಣೆ - ಎಐ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್</title>
  <link rel="stylesheet" href="style2.css">
  <style>
    .transfer-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">
      <span class="transfer-icon">💸</span> ಹಣ ವರ್ಗಾವಣೆ
    </h1>
    <p class="subtitle">ಸುರಕ್ಷಿತವಾಗಿ ಹಣವನ್ನು ಕಳುಹಿಸಿ</p>

    <form class="form-card fade-in" id="transferForm">
      <div class="input-group">
        <input type="text" id="fromAccount" maxlength="12" pattern="[0-9]{12}" required>
        <label>ನಿಂದ ಖಾತೆ ಸಂಖ್ಯೆ</label>
      </div>
      
      <div class="input-group">
        <input type="text" id="toAccount" maxlength="12" pattern="[0-9]{12}" required>
        <label>ಗೆ ಖಾತೆ ಸಂಖ್ಯೆ</label>
      </div>
      
      <div class="input-group">
        <input type="number" id="transferAmount" required>
        <label>ಮೊತ್ತ (₹)</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 ಅಂಕೆಗಳು)</label>
      </div>

      <button type="submit" class="btn-submit" style="background: linear-gradient(135deg, #32CD32, #228B22);">💰 ಹಣ ವರ್ಗಾವಣೆ ಮಾಡಿ</button>
      <a href="index.html" class="btn-back">⬅️ ಹಿಂದಕ್ಕೆ</a>
    </form>
  </div>

  <script>
    const form = document.getElementById("transferForm");
    let recognition = null;
    let isListening = false;
    let voiceStep = 'fromAccount'; // 'fromAccount', 'toAccount', 'amount', 'pin'

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'kn-IN';
    }

    function getVoices() {
      return speechSynthesis.getVoices();
    }
    
    function speak(text, useEnglish = false) {
      const voices = getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (useEnglish) {
        utterance.lang = 'en-US';
        utterance.text = text;
        console.log("⚠️ Using English fallback for Kannada");
      } else {
        // Try to find Kannada voice - check multiple patterns
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' ||
          v.lang === 'kn'
        );
        
        if (kannadaVoice) {
          utterance.lang = 'kn-IN';
          utterance.voice = kannadaVoice;
          utterance.text = text;
          console.log("✅ Using Kannada voice:", kannadaVoice.name, kannadaVoice.lang);
        } else {
          console.log("⚠️ Kannada voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
          utterance.lang = 'kn-IN';
          utterance.text = text;
          console.log("🔊 Attempting to speak Kannada text with kn-IN language code");
        }
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      try {
        recognition.stop();
      } catch(e) {}
      
      recognition.onresult = (event) => {
        if (event.results.length > 0) {
          const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
          console.log("Heard:", command);
          handleVoiceCommand(command);
        }
      };
      
      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          alert("ಮೈಕ್ರೋಫೋನ್ ಅನುಮತಿ ನಿರಾಕರಿಸಲಾಗಿದೆ");
          isListening = false;
        } else if (event.error !== 'aborted' && event.error !== 'no-speech') {
          setTimeout(() => {
            if (isListening) {
              try { recognition.start(); } catch(e) {}
            }
          }, 1000);
        }
      };
      
      recognition.onend = () => {
        if (isListening) {
          setTimeout(() => {
            try { recognition.start(); } catch(e) {}
          }, 500);
        }
      };
      
      try {
        recognition.start();
        isListening = true;
      } catch(e) {
        console.log("Error:", e);
      }
    }

    function handleVoiceCommand(command) {
      const fromInput = document.getElementById("fromAccount");
      const toInput = document.getElementById("toAccount");
      const amountInput = document.getElementById("transferAmount");
      const pinInput = document.getElementById("pin");

      if (command.includes('ಹಿಂದಕ್ಕೆ') || command.includes('back') || command.includes('undo')) {
        window.location.href = "index.html";
        return;
      }

      if (voiceStep === 'fromAccount') {
        const accountMatch = command.match(/(?:ನಿಂದ|ಖಾತೆ|ಸಂಖ್ಯೆ|account|from)\s*(\d+)|(\d{12})|(\d{4,12})/);
        if (accountMatch) {
          const accNum = accountMatch[1] || accountMatch[2] || accountMatch[3];
          if (accNum && accNum.length >= 4 && accNum.length <= 12) {
            fromInput.value = accNum;
            speak(`ನಿಂದ ಖಾತೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಸ್ವೀಕರಿಸುವವರ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.`);
            voiceStep = 'toAccount';
          }
        }
      } else if (voiceStep === 'toAccount') {
        const accountMatch = command.match(/(?:ಗೆ|ಸ್ವೀಕರಿಸುವವರು|ಖಾತೆ|ಸಂಖ್ಯೆ|to|account)\s*(\d+)|(\d{12})|(\d{4,12})/);
        if (accountMatch) {
          const accNum = accountMatch[1] || accountMatch[2] || accountMatch[3];
          if (accNum && accNum.length >= 4 && accNum.length <= 12) {
            toInput.value = accNum;
            speak(`ಗೆ ಖಾತೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ವರ್ಗಾವಣೆ ಮೊತ್ತವನ್ನು ಹೇಳಿ.`);
            voiceStep = 'amount';
          }
        }
      } else if (voiceStep === 'amount') {
        const amountMatch = command.match(/(\d+)(?:\s*ರೂಪಾಯಿ|rupees|rs)?/);
        if (amountMatch) {
          const amount = parseInt(amountMatch[1]);
          amountInput.value = amount;
          speak(`${amount} ರೂಪಾಯಿ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.`);
          voiceStep = 'pin';
        }
      } else if (voiceStep === 'pin') {
        const pinMatch = command.match(/(\d{4})/);
        if (pinMatch) {
          const pin = pinMatch[1];
          pinInput.value = pin;
          speak(`PIN ನಮೂದಿಸಲಾಗಿದೆ. ವರ್ಗಾವಣೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ.`);
          setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        }
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        speak("ಹಣ ವರ್ಗಾವಣೆ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ಮೊದಲು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.");
        startListening();
      }, 1000);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }

      const from_account = parseInt(document.getElementById("fromAccount").value.trim(), 10);
      const to_account = parseInt(document.getElementById("toAccount").value.trim(), 10);
      const amount = parseFloat(document.getElementById("transferAmount").value);
      const pin = document.getElementById("pin").value;

      if (!from_account || !to_account || !amount || !pin) {
        speak("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಫೀಲ್ಡ್‌ಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ");
        return;
      }

      if (from_account === to_account) {
        speak("ನಿಂದ ಮತ್ತು ಗೆ ಖಾತೆಗಳು ಒಂದೇ ಆಗಿರಬಾರದು");
        alert("ನಿಂದ ಮತ್ತು ಗೆ ಖಾತೆಗಳು ಒಂದೇ ಆಗಿರಬಾರದು");
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        speak("PIN ನಿಖರವಾಗಿ 4 ಅಂಕೆಗಳಾಗಿರಬೇಕು");
        return;
      }

      speak("ನಿಮ್ಮ ವರ್ಗಾವಣೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ. ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ.");

      try {
        const response = await fetch("http://localhost:5000/transfer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from_account, to_account, amount, pin })
        });

        const data = await response.json();
        
        if (response.ok) {
          speak(`ವರ್ಗಾವಣೆ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್ ${data.sender_balance_after} ರೂಪಾಯಿ.`);
          
          // Store transaction data for receipt
          const transactionData = {
            type: 'Transfer',
            type_kn: 'ವರ್ಗಾವಣೆ',
            from_account: from_account,
            to_account: to_account,
            from_name: data.from_name,
            to_name: data.to_name,
            amount: amount,
            sender_balance_after: data.sender_balance_after,
            transaction_id: generateTransactionId()
          };
          
          // Show success message with download option
          showSuccessMessage(transactionData);
          form.reset();
          voiceStep = 'fromAccount';
        } else {
          speak(data.message || "ವರ್ಗಾವಣೆ ವಿಫಲವಾಗಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
          alert(data.message || "ವರ್ಗಾವಣೆ ವಿಫಲವಾಗಿದೆ");
          voiceStep = 'fromAccount';
        }
      } catch (error) {
        speak("ಸರ್ವರ್ ತಲುಪಲಾಗುವುದಿಲ್ಲ. ದಯವಿಟ್ಟು ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆ ಎಂದು ಖಚಿತಪಡಿಸಿ.");
        alert("❌ ಸರ್ವರ್ ತಲುಪಲಾಗುವುದಿಲ್ಲ. ದಯವಿಟ್ಟು ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆ ಎಂದು ಖಚಿತಪಡಿಸಿ.");
        console.error("Error:", error);
      }
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #32CD32; margin-bottom: 15px; background: #32CD32; color: white; padding: 15px; border-radius: 10px 10px 0 0; margin: -30px -30px 20px -30px;">✅ ವರ್ಗಾವಣೆ ಯಶಸ್ವಿಯಾಗಿದೆ!</h2>
          <p><strong>ನಿಂದ ಖಾತೆ:</strong> ****${String(transactionData.from_account).slice(-4)}</p>
          <p><strong>ಗೆ ಖಾತೆ:</strong> ****${String(transactionData.to_account).slice(-4)}</p>
          <p><strong>ಮೊತ್ತ:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p><strong>ವರ್ಗಾವಣೆಯ ನಂತರ ಬ್ಯಾಲೆನ್ಸ್:</strong> ₹${transactionData.sender_balance_after.toLocaleString('en-IN')}</p>
          <p><strong>ಸಮಯ:</strong> ${new Date().toLocaleString('kn-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #4facfe; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              📥 ರಸೀತಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ
            </button>
            <button id="closeModalBtn" 
                    style="background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              ಮುಚ್ಚಿ
            </button>
          </div>
        </div>
      `;
      
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: #2a2a2a; padding: 0; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: white;';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    function downloadReceipt(transactionData) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('kn-IN', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      const timeStr = now.toLocaleTimeString('kn-IN', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });

      const receiptHTML = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transfer Receipt - ${transactionData.transaction_id}</title>
  <style>
    @media print { body { margin: 0; } .no-print { display: none; } }
    body { font-family: 'Arial', 'Noto Sans Kannada', sans-serif; max-width: 600px; margin: 20px auto; padding: 30px; background: #f5f5f5; }
    .receipt-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { text-align: center; border-bottom: 3px solid #32CD32; padding-bottom: 20px; margin-bottom: 30px; }
    .bank-name { font-size: 28px; font-weight: bold; color: #32CD32; margin-bottom: 5px; }
    .bank-tagline { font-size: 14px; color: #666; }
    .receipt-title { text-align: center; font-size: 24px; font-weight: bold; color: #32CD32; margin: 20px 0; }
    .transaction-info { margin: 25px 0; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info-label { font-weight: bold; color: #333; }
    .info-value { color: #666; text-align: right; }
    .amount-row { background: #f0fff0; padding: 15px; border-radius: 5px; margin: 20px 0; }
    .amount-label { font-size: 18px; font-weight: bold; color: #32CD32; }
    .amount-value { font-size: 24px; font-weight: bold; color: #32CD32; margin-top: 5px; }
    .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; color: #999; font-size: 12px; }
    .transaction-id { background: #fff3cd; padding: 10px; border-radius: 5px; text-align: center; margin: 20px 0; font-family: 'Courier New', monospace; font-weight: bold; color: #856404; }
  </style>
</head>
<body>
  <div class="receipt-container">
    <div class="header">
      <div class="bank-name">🤖 AI Voice Banking</div>
      <div class="bank-tagline">ನಿಮ್ಮ ಸ್ಮಾರ್ಟ್ ಬ್ಯಾಂಕಿಂಗ್ ಪರಿಹಾರ</div>
    </div>
    <div class="receipt-title">${transactionData.type_kn} ರಸೀತಿ</div>
    <div class="transaction-id">ವಹಿವಾಟು ID: ${transactionData.transaction_id}</div>
    <div class="transaction-info">
      <div class="info-row"><span class="info-label">ದಿನಾಂಕ:</span><span class="info-value">${dateStr}</span></div>
      <div class="info-row"><span class="info-label">ಸಮಯ:</span><span class="info-value">${timeStr}</span></div>
      <div class="info-row"><span class="info-label">ನಿಂದ ಖಾತೆ:</span><span class="info-value">${transactionData.from_account}</span></div>
      <div class="info-row"><span class="info-label">ನಿಂದ ಹೆಸರು:</span><span class="info-value">${transactionData.from_name}</span></div>
      <div class="info-row"><span class="info-label">ಗೆ ಖಾತೆ:</span><span class="info-value">${transactionData.to_account}</span></div>
      <div class="info-row"><span class="info-label">ಗೆ ಹೆಸರು:</span><span class="info-value">${transactionData.to_name}</span></div>
    </div>
    <div class="amount-row">
      <div class="amount-label">ವರ್ಗಾವಣೆ ಮೊತ್ತ</div>
      <div class="amount-value">₹${transactionData.amount.toLocaleString('en-IN')}</div>
    </div>
    <div class="info-row">
      <span class="info-label">ವರ್ಗಾವಣೆಯ ನಂತರ ನಿಮ್ಮ ಬ್ಯಾಲೆನ್ಸ್:</span>
      <span class="info-value" style="font-weight: bold; color: #32CD32;">₹${transactionData.sender_balance_after.toLocaleString('en-IN')}</span>
    </div>
    <div class="footer">
      <p>ಧನ್ಯವಾದಗಳು! ನಿಮ್ಮ ವಹಿವಾಟು ಯಶಸ್ವಿಯಾಗಿದೆ.</p>
      <p>ಇದು ಕಂಪ್ಯೂಟರ್-ಉತ್ಪಾದಿತ ರಸೀತಿ ಮತ್ತು ಸಹಿಯ ಅಗತ್ಯವಿಲ್ಲ.</p>
    </div>
  </div>
</body>
</html>`;

      const blob = new Blob([receiptHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `Receipt_${transactionData.transaction_id}_Transfer.html`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      
      closeSuccessMessage();
      speak("ರಸೀತಿ ಯಶಸ್ವಿಯಾಗಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಲಾಗಿದೆ.");
    }

    // Microphone button
    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #32CD32; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (isListening) {
        recognition.stop();
        isListening = false;
        micBtn.style.background = '#32CD32';
      } else {
        speak("ಕೇಳುತ್ತಿದ್ದೇನೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ವಿವರಗಳನ್ನು ಹೇಳಿ.");
        micBtn.style.background = '#ff6b6b';
        setTimeout(() => startListening(), 1000);
      }
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
