<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಹಣ ತೆಗೆಯಿರಿ - ಎಐ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">📉 ಹಣ ತೆಗೆಯಿರಿ</h1>
    <p class="subtitle">ಹಣ ತೆಗೆಯಲು ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>ಖಾತೆ ಸಂಖ್ಯೆ (12 ಅಂಕೆಗಳು)</label>
      </div>

      <div class="input-group">
        <input type="number" id="withdrawAmount" required>
        <label>ತೆಗೆಯುವ ಮೊತ್ತ (₹)</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 ಅಂಕೆಗಳು)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ ತೆಗೆಯಿರಿ</button>
      <a href="index.html" class="btn-back">⬅️ ಹಿಂದಕ್ಕೆ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("withdrawAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    let voiceStep = 'account';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'kn-IN';
    }

    function speak(text, useEnglish = false) {
      const utterance = new SpeechSynthesisUtterance(text);
      if (useEnglish) {
        utterance.lang = 'en-US';
        const englishText = text
          .replace(/ಹಣ ತೆಗೆಯುವಿಕೆ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ/g, 'Welcome to withdrawal page')
          .replace(/ದಯವಿಟ್ಟು ಮೊದಲು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ/g, 'Please say your account number first')
          .replace(/ಖಾತೆ ಸಂಖ್ಯೆ/g, 'account number')
          .replace(/ನಮೂದಿಸಲಾಗಿದೆ/g, 'entered')
          .replace(/ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ/g, 'Please say the withdrawal amount')
          .replace(/ಮೊತ್ತ/g, 'amount')
          .replace(/ರೂಪಾಯಿ/g, 'rupees')
          .replace(/ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ/g, 'Please say your four digit PIN')
          .replace(/PIN ನಮೂದಿಸಲಾಗಿದೆ/g, 'PIN entered')
          .replace(/ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ/g, 'Processing withdrawal')
          .replace(/ಯಶಸ್ವಿಯಾಗಿದೆ/g, 'successful')
          .replace(/ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್/g, 'new balance')
          .replace(/ವಿಫಲವಾಗಿದೆ/g, 'failed')
          .replace(/ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ/g, 'try again');
        utterance.text = englishText || text;
      } else {
        utterance.lang = 'kn-IN';
        utterance.text = text;
      }
      utterance.rate = 0.9;
      
      const voices = speechSynthesis.getVoices();
      const kannadaVoice = voices.find(v => v.lang.startsWith('kn'));
      
      if (!kannadaVoice && !useEnglish) {
        speak(text, true);
        return;
      }
      
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
      isListening = true;
      recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        handleVoiceCommand(command);
      };
      recognition.onend = () => { isListening = false; };
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("withdrawAmount");
      const pinInput = document.getElementById("pin");
      
      if (voiceStep === 'account') {
        const accountMatch = command.match(/(?:ಖಾತೆ|ಸಂಖ್ಯೆ|account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
        if (accountMatch) {
          const accNum = accountMatch[1] || accountMatch[2];
          accountInput.value = accNum;
          speak(`ಖಾತೆ ಸಂಖ್ಯೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ.`);
          voiceStep = 'amount';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'amount') {
        const amountMatch = command.match(/(\d+)\s*(?:ರೂಪಾಯಿ|rupees|rs|ಮೊತ್ತ)/i) || command.match(/(\d+)/);
        if (amountMatch) {
          const amount = amountMatch[1];
          amountInput.value = amount;
          speak(`ಮೊತ್ತ ${amount} ರೂಪಾಯಿ ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ.`);
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಐದು ನೂರು') || command.includes('500')) {
          amountInput.value = 500;
          speak("ಐದು ನೂರು ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಒಂದು ಸಾವಿರ') || command.includes('1000')) {
          amountInput.value = 1000;
          speak("ಒಂದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಎರಡು ಸಾವಿರ') || command.includes('2000')) {
          amountInput.value = 2000;
          speak("ಎರಡು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಐದು ಸಾವಿರ') || command.includes('5000')) {
          amountInput.value = 5000;
          speak("ಐದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'pin') {
        const pinMatch = command.match(/(\d{4})/);
        if (pinMatch) {
          const pin = pinMatch[1];
          pinInput.value = pin;
          speak(`PIN ನಮೂದಿಸಲಾಗಿದೆ. ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ.`);
          setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        } else {
          speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿ.");
          setTimeout(() => startListening(), 2000);
        }
      }
    }

    let voicesLoaded = false;
    speechSynthesis.onvoiceschanged = () => {
      voicesLoaded = true;
    };

    window.addEventListener('load', () => {
      if (!voicesLoaded) {
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) voicesLoaded = true;
      }
      
      setTimeout(() => {
        const kannadaText = "ಹಣ ತೆಗೆಯುವಿಕೆ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ಮೊದಲು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.";
        const englishText = "Welcome to withdrawal page. Please say your account number first.";
        speak(kannadaText);
        setTimeout(() => startListening(), 3000);
      }, 1000);
    });

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const withdraw_amount = parseFloat(document.getElementById("withdrawAmount").value);
      const pin = document.getElementById("pin").value;

      if (!account_number || !withdraw_amount || !pin) {
        speak("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಫೀಲ್ಡ್‌ಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ");
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        speak("PIN ನಾಲ್ಕು ಅಂಕೆಗಳಾಗಿರಬೇಕು");
        return;
      }

      speak("ನಿಮ್ಮ ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ. ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ.");

      try {
        const response = await fetch("http://localhost:5000/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account_number, withdraw_amount, pin })
        });
        const data = await response.json();
        if (response.ok) {
          speak(`ಹಣ ತೆಗೆಯುವಿಕೆ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್ ${data.new_balance} ರೂಪಾಯಿ.`);
          alert(`ಹಣ ತೆಗೆಯುವಿಕೆ ಯಶಸ್ವಿಯಾಗಿದೆ!\n\nಖಾತೆ: ${data.account_number}\nಹೆಸರು: ${data.full_name}\nತೆಗೆದ ಮೊತ್ತ: ₹${data.withdraw_amount}\nಹಳೆಯ ಬ್ಯಾಲೆನ್ಸ್: ₹${data.old_balance}\nಹೊಸ ಬ್ಯಾಲೆನ್ಸ್: ₹${data.new_balance}`);
          form.reset();
          voiceStep = 'account';
        } else {
          speak(data.message || "ಹಣ ತೆಗೆಯುವಿಕೆ ವಿಫಲವಾಗಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
          alert(data.message || "ಹಣ ತೆಗೆಯುವಿಕೆ ವಿಫಲವಾಗಿದೆ");
          voiceStep = 'account';
        }
      } catch (error) {
        speak("ಸರ್ವರ್ ತಲುಪಲು ಸಾಧ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.");
        alert("❌ ಸರ್ವರ್ ತಲುಪಲು ಸಾಧ್ಯವಿಲ್ಲ");
      }
    });

    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #ff6b6b; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (voiceStep === 'account') {
        speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.");
      } else if (voiceStep === 'amount') {
        speak("ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ.");
      } else {
        speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ.");
      }
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
