<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಹಣ ತೆಗೆಯಿರಿ - ಎಐ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">📉 ಹಣ ತೆಗೆಯಿರಿ</h1>
    <p class="subtitle">ಹಣ ತೆಗೆಯಲು ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>ಖಾತೆ ಸಂಖ್ಯೆ (12 ಅಂಕೆಗಳು)</label>
      </div>

      <div class="input-group">
        <input type="number" id="withdrawAmount" required>
        <label>ತೆಗೆಯುವ ಮೊತ್ತ (₹)</label>
      </div>

      <div class="input-group">
        <input type="password" id="pin" maxlength="4" pattern="[0-9]{4}" required>
        <label>PIN (4 ಅಂಕೆಗಳು)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ ತೆಗೆಯಿರಿ</button>
      <a href="index.html" class="btn-back">⬅️ ಹಿಂದಕ್ಕೆ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("withdrawAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    let voiceStep = 'account';
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'kn-IN';
    }

    function getVoices() {
      return speechSynthesis.getVoices();
    }
    
    function speak(text, useEnglish = false) {
      const voices = getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (useEnglish) {
        utterance.lang = 'en-US';
        const englishText = text
          .replace(/ಹಣ ತೆಗೆಯುವಿಕೆ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ/g, 'Welcome to withdrawal page')
          .replace(/ದಯವಿಟ್ಟು ಮೊದಲು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ/g, 'Please say your account number first')
          .replace(/ಖಾತೆ ಸಂಖ್ಯೆ/g, 'account number')
          .replace(/ನಮೂದಿಸಲಾಗಿದೆ/g, 'entered')
          .replace(/ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ/g, 'Please say the withdrawal amount')
          .replace(/ಮೊತ್ತ/g, 'amount')
          .replace(/ರೂಪಾಯಿ/g, 'rupees')
          .replace(/ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ/g, 'Please say your four digit PIN')
          .replace(/PIN ನಮೂದಿಸಲಾಗಿದೆ/g, 'PIN entered')
          .replace(/ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ/g, 'Processing withdrawal')
          .replace(/ಯಶಸ್ವಿಯಾಗಿದೆ/g, 'successful')
          .replace(/ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್/g, 'new balance')
          .replace(/ವಿಫಲವಾಗಿದೆ/g, 'failed')
          .replace(/ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ/g, 'try again');
        utterance.text = englishText || text;
        console.log("⚠️ Using English fallback for Kannada");
      } else {
        // Try to find Kannada voice - check multiple patterns
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' ||
          v.lang === 'kn'
        );
        
        if (kannadaVoice) {
          utterance.lang = 'kn-IN';
          utterance.voice = kannadaVoice;
          utterance.text = text;
          console.log("✅ Using Kannada voice:", kannadaVoice.name, kannadaVoice.lang);
        } else {
          console.log("⚠️ Kannada voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
          // Still try to use Kannada language code - browser might have a fallback
          utterance.lang = 'kn-IN';
          utterance.text = text; // Keep original Kannada text
          console.log("🔊 Attempting to speak Kannada text with kn-IN language code");
        }
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      console.log("🔊 Speaking in Kannada withdraw page:", text.substring(0, 50));
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
      isListening = true;
      recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        handleVoiceCommand(command);
      };
      recognition.onend = () => { isListening = false; };
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("withdrawAmount");
      const pinInput = document.getElementById("pin");
      
      if (voiceStep === 'account') {
        const accountMatch = command.match(/(?:ಖಾತೆ|ಸಂಖ್ಯೆ|account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
        if (accountMatch) {
          const accNum = accountMatch[1] || accountMatch[2];
          accountInput.value = accNum;
          speak(`ಖಾತೆ ಸಂಖ್ಯೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ.`);
          voiceStep = 'amount';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'amount') {
        const amountMatch = command.match(/(\d+)\s*(?:ರೂಪಾಯಿ|rupees|rs|ಮೊತ್ತ)/i) || command.match(/(\d+)/);
        if (amountMatch) {
          const amount = amountMatch[1];
          amountInput.value = amount;
          speak(`ಮೊತ್ತ ${amount} ರೂಪಾಯಿ ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ.`);
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಐದು ನೂರು') || command.includes('500')) {
          amountInput.value = 500;
          speak("ಐದು ನೂರು ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಒಂದು ಸಾವಿರ') || command.includes('1000')) {
          amountInput.value = 1000;
          speak("ಒಂದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಎರಡು ಸಾವಿರ') || command.includes('2000')) {
          amountInput.value = 2000;
          speak("ಎರಡು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        } else if (command.includes('ಐದು ಸಾವಿರ') || command.includes('5000')) {
          amountInput.value = 5000;
          speak("ಐದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ PIN ಅನ್ನು ಹೇಳಿ.");
          voiceStep = 'pin';
          setTimeout(() => startListening(), 2000);
        }
      } else if (voiceStep === 'pin') {
        const pinMatch = command.match(/(\d{4})/);
        if (pinMatch) {
          const pin = pinMatch[1];
          pinInput.value = pin;
          speak(`PIN ನಮೂದಿಸಲಾಗಿದೆ. ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ.`);
          setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        } else {
          speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿ.");
          setTimeout(() => startListening(), 2000);
        }
      }
    }

    let voicesLoaded = false;
    speechSynthesis.onvoiceschanged = () => {
      voicesLoaded = true;
    };

    window.addEventListener('load', () => {
      if (!voicesLoaded) {
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) voicesLoaded = true;
      }
      
      setTimeout(() => {
        const kannadaText = "ಹಣ ತೆಗೆಯುವಿಕೆ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ಮೊದಲು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.";
        const englishText = "Welcome to withdrawal page. Please say your account number first.";
        speak(kannadaText);
        setTimeout(() => startListening(), 3000);
      }, 1000);
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #ff6b6b; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);">✅ ಹಣ ತೆಗೆಯುವಿಕೆ ಯಶಸ್ವಿಯಾಗಿದೆ!</h2>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಖಾತೆ:</strong> ${transactionData.account_number}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹೆಸರು:</strong> ${transactionData.full_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಶಾಖೆ:</strong> ${transactionData.branch_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ತೆಗೆದ ಮೊತ್ತ:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹಳೆಯ ಬ್ಯಾಲೆನ್ಸ್:</strong> ₹${transactionData.old_balance.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್:</strong> ₹${transactionData.new_balance.toLocaleString('en-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #4facfe; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              📥 ರಸೀತಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ
            </button>
            <button id="closeModalBtn" 
                    style="background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              ಮುಚ್ಚಿ
            </button>
          </div>
        </div>
      `;
      
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: rgba(15, 27, 46, 0.95); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(33, 150, 243, 0.3); border: 1px solid rgba(33, 150, 243, 0.3); color: white;';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    function downloadReceipt(transactionData) {
      // Receipt download functionality - can be implemented later
      alert("ರಸೀತಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...");
    }

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const withdraw_amount = parseFloat(document.getElementById("withdrawAmount").value);
      const pin = document.getElementById("pin").value;

      if (!account_number || !withdraw_amount || !pin) {
        speak("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಫೀಲ್ಡ್‌ಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ");
        return;
      }

      if (pin.length !== 4 || !/^\d+$/.test(pin)) {
        speak("PIN ನಾಲ್ಕು ಅಂಕೆಗಳಾಗಿರಬೇಕು");
        return;
      }

      speak("ನಿಮ್ಮ ಹಣ ತೆಗೆಯುವಿಕೆ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ. ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ.");

      try {
        const response = await fetch("http://localhost:5000/withdraw", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ account_number, withdraw_amount, pin })
        });
        const data = await response.json();
        if (response.ok) {
          speak(`ಹಣ ತೆಗೆಯುವಿಕೆ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್ ${data.new_balance} ರೂಪಾಯಿ.`);
          
          // Store transaction data for receipt
          const transactionData = {
            type: 'Withdrawal',
            type_kn: 'ಹಣ ತೆಗೆಯುವಿಕೆ',
            account_number: data.account_number,
            full_name: data.full_name,
            branch_name: data.branch_name,
            amount: data.withdraw_amount,
            old_balance: data.old_balance,
            new_balance: data.new_balance,
            transaction_id: generateTransactionId()
          };
          
          // Show success message with download option
          showSuccessMessage(transactionData);
          form.reset();
          voiceStep = 'account';
        } else {
          speak(data.message || "ಹಣ ತೆಗೆಯುವಿಕೆ ವಿಫಲವಾಗಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
          alert(data.message || "ಹಣ ತೆಗೆಯುವಿಕೆ ವಿಫಲವಾಗಿದೆ");
          voiceStep = 'account';
        }
      } catch (error) {
        speak("ಸರ್ವರ್ ತಲುಪಲು ಸಾಧ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.");
        alert("❌ ಸರ್ವರ್ ತಲುಪಲು ಸಾಧ್ಯವಿಲ್ಲ");
      }
    });

    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #ff6b6b; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      if (voiceStep === 'account') {
        speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ.");
      } else if (voiceStep === 'amount') {
        speak("ದಯವಿಟ್ಟು ಹಣ ತೆಗೆಯುವ ಮೊತ್ತವನ್ನು ಹೇಳಿ.");
      } else {
        speak("ದಯವಿಟ್ಟು ನಿಮ್ಮ ನಾಲ್ಕು ಅಂಕಿಯ PIN ಅನ್ನು ಹೇಳಿ.");
      }
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
