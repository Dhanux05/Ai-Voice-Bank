<!DOCTYPE html>
<html lang="en">   
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI Voice Banking</title>
  <link rel="stylesheet" href="style2.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', 'Noto Sans Kannada', sans-serif;
    }
    .kannada-text {
      font-family: 'Noto Sans Kannada', sans-serif;
    }
  </style>
</head>
<body>
  <!-- Background Animation -->
  <div class="bg-animation"></div>

  <!-- Main Container -->
  <div class="container">
    <h1 class="title" id="mainTitle">🤖 AI Voice Banking</h1>
    <p class="subtitle" id="mainSubtitle">Your smart voice assistant for banking</p>

    <!-- Language Selection Page -->
    <div class="card fade-in" id="langCard">
      <h2>Select Language 🌐</h2>
      <div class="btn-group">
        <button class="btn btn-cyan" data-lang="en">English</button>
        <button class="btn btn-blue" data-lang="hi">हिंदी</button>
        <button class="btn btn-purple" data-lang="kn">ಕನ್ನಡ</button>
      </div>
    </div>

    <!-- Auth Selection Page (Register/Login) -->
    <div class="card fade-in hidden" id="authCard">
      <h2 id="authTitle">Continue in English</h2>
      <p id="authSubtitle" style="margin: 15px 0 25px 0; opacity: 0.8;">Please register or log in to continue</p>
      <div class="btn-group" style="flex-direction: column; gap: 15px;">
        <button class="btn btn-blue" id="btnRegister" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <span>📝</span> <span id="registerText">Register</span>
        </button>
        <button class="btn btn-blue" id="btnLogin" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <span>🔐</span> <span id="loginText">Login</span>
        </button>
        <button class="btn btn-dark" id="btnBackLang" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <span>⬅️</span> <span id="backText">Back</span>
        </button>
      </div>
    </div>

    <!-- Main Menu Page -->
    <div class="card fade-in hidden" id="menu">
      <h2 id="menuTitle">Choose an Option 🎙️</h2>
      <div class="btn-group">
        <button class="btn btn-cyan" id="btnDeposit">💰 Deposit</button>
        <button class="btn btn-red" id="btnWithdraw">📉 Withdraw</button>
        <button class="btn btn-blue" id="btnBalance">📊 Balance</button>
        <button class="btn btn-transfer" id="btnTransfer">💸 Transfer</button>
        <button class="btn btn-dark" id="btnExit">❌ Exit</button>
      </div>
    </div>
  </div>

  <script>
    const langCard = document.getElementById("langCard");
    const menu = document.getElementById("menu");
    const langButtons = langCard.querySelectorAll("button");

    let selectedLang = "en"; // default
    let recognition = null;
    let isListening = false;

    // Initialize Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true; // Keep listening
      recognition.interimResults = false;
    }

    // Voice prompts in different languages
    const voicePrompts = {
      en: {
        langSelection: "Please choose your language. Say English, Hindi, or Kannada",
        menuOptions: "Choose an option. Say Deposit, Withdraw, Balance, Transfer, or Exit"
      },
      hi: {
        langSelection: "कृपया अपनी भाषा चुनें। अंग्रेजी, हिंदी, या कन्नड़ कहें",
        menuOptions: "एक विकल्प चुनें। जमा, निकालें, बैलेंस, स्थानांतरण, या बाहर जाएँ कहें"
      },
      kn: {
        langSelection: "ದಯವಿಟ್ಟು ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ। ಇಂಗ್ಲೀಷ್, ಹಿಂದಿ, ಅಥವಾ ಕನ್ನಡ ಎಂದು ಹೇಳಿ",
        menuOptions: "ಒಂದು ಆಯ್ಕೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ। ಠೇವಣಿ, ಹಣ ತೆಗೆಯಿರಿ, ಬ್ಯಾಲೆನ್ಸ್, ವರ್ಗಾವಣೆ, ಅಥವಾ ನಿರ್ಗಮಿಸಿ ಎಂದು ಹೇಳಿ"
      }
    };

    // Get available voices
    function getVoices() {
      return speechSynthesis.getVoices();
    }
    
    // Wait for voices to load
    function waitForVoices(callback) {
      const voices = getVoices();
      if (voices.length > 0) {
        callback(voices);
      } else {
        speechSynthesis.onvoiceschanged = () => {
          callback(getVoices());
        };
        // Fallback timeout
        setTimeout(() => callback(getVoices()), 1000);
      }
    }
    
    // Speak function with proper fallback for Hindi and Kannada
    function speak(text, lang = 'en') {
      // Get voices immediately (don't wait)
      let voices = getVoices();
      
      // If no voices yet, try to trigger loading
      if (voices.length === 0) {
        const dummyUtterance = new SpeechSynthesisUtterance('');
        speechSynthesis.speak(dummyUtterance);
        speechSynthesis.cancel();
        voices = getVoices();
      }
      
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (lang === 'kn') {
        // Try to find Kannada voice - check multiple patterns
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' ||
          v.lang === 'kn'
        );
        
        if (kannadaVoice) {
          utterance.lang = 'kn-IN';
          utterance.voice = kannadaVoice;
          utterance.text = text; // Use original Kannada text
          console.log("✅ Using Kannada voice:", kannadaVoice.name, kannadaVoice.lang);
        } else {
          console.log("⚠️ Kannada voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
          // Still try to use Kannada language code - browser might have a fallback
          utterance.lang = 'kn-IN';
          utterance.text = text; // Keep original Kannada text
          console.log("🔊 Attempting to speak Kannada text with kn-IN language code");
        }
      } else if (lang === 'hi') {
        // Try to find Hindi voice - check multiple patterns
        const hindiVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('hi') || 
          v.lang.toLowerCase().includes('hindi') || 
          v.name.toLowerCase().includes('hindi') ||
          v.lang === 'hi-IN' ||
          v.lang === 'hi'
        );
        
        if (hindiVoice) {
          utterance.lang = 'hi-IN';
          utterance.voice = hindiVoice;
          utterance.text = text; // Use original Hindi text
          console.log("✅ Using Hindi voice:", hindiVoice.name, hindiVoice.lang);
        } else {
          console.log("⚠️ Hindi voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
          // Still try to use Hindi language code - browser might have a fallback
          utterance.lang = 'hi-IN';
          utterance.text = text; // Keep original Hindi text
          console.log("🔊 Attempting to speak Hindi text with hi-IN language code");
        }
      } else {
        // English
        utterance.lang = 'en-US';
        const englishVoice = voices.find(v => v.lang.startsWith('en') && v.localService === false) || 
                            voices.find(v => v.lang.startsWith('en'));
        if (englishVoice) {
          utterance.voice = englishVoice;
        }
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      
      console.log("🔊 Speaking:", text.substring(0, 50) + "...", "Language code:", utterance.lang);
      speechSynthesis.speak(utterance);
    }
    
    // Load voices on page load
    let voicesLoaded = false;
    
    // Force load voices immediately
    const loadVoices = () => {
      const voices = getVoices();
      if (voices.length > 0) {
        voicesLoaded = true;
        console.log("✅ Voices loaded:", voices.length);
        // Log available languages
        const languages = [...new Set(voices.map(v => v.lang))];
        const hindiVoices = voices.filter(v => v.lang.startsWith('hi'));
        const kannadaVoices = voices.filter(v => v.lang.startsWith('kn'));
        console.log("Hindi voices available:", hindiVoices.length, hindiVoices.map(v => v.name));
        console.log("Kannada voices available:", kannadaVoices.length, kannadaVoices.map(v => v.name));
        console.log("Available languages:", languages.filter(l => l.includes('hi') || l.includes('kn')));
      }
    };
    
    // Try to load voices immediately
    loadVoices();
    
    speechSynthesis.onvoiceschanged = () => {
      loadVoices();
    };
    
    // Force trigger voice loading (some browsers need this)
    if (getVoices().length === 0) {
      const dummyUtterance = new SpeechSynthesisUtterance('');
      speechSynthesis.speak(dummyUtterance);
      speechSynthesis.cancel();
      setTimeout(loadVoices, 500);
    }

    // Start voice recognition
    function startListening(lang = 'en') {
      if (!recognition) {
        console.log("Speech recognition not supported");
        alert("Your browser doesn't support speech recognition. Please use Chrome or Edge.");
        return;
      }

      // Stop any existing recognition
      try {
        recognition.stop();
        isListening = false;
      } catch(e) {}

      recognition.lang = lang === 'en' ? 'en-US' : lang === 'hi' ? 'hi-IN' : 'kn-IN';
      recognition.continuous = true;
      recognition.interimResults = false;
      
      console.log("Starting recognition for language:", recognition.lang);
      
      recognition.onstart = () => {
        isListening = true;
        if (listeningIndicator) listeningIndicator.style.display = 'block';
        if (micButton) {
          micButton.style.background = '#ff6b6b';
          micButton.innerHTML = '🔴';
        }
        console.log("🎤 Listening started for:", lang);
      };
      
      recognition.onresult = (event) => {
            if (event.results.length > 0) {
              const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
              console.log("🎤 Heard:", command, "in language:", lang);
              handleVoiceCommand(command, lang);
            }
          };

      recognition.onerror = (event) => {
        console.log("Recognition error:", event.error);
        if (event.error === 'not-allowed') {
          alert("Microphone permission denied. Please allow microphone access and refresh the page.");
          isListening = false;
        } else if (event.error === 'no-speech') {
          // Restart listening if no speech detected
          setTimeout(() => {
            if (!isListening) return;
            try {
              recognition.start();
            } catch(e) {
              console.log("Could not restart:", e);
            }
          }, 1000);
        } else if (event.error !== 'aborted') {
          // Restart on other errors
          setTimeout(() => {
            if (!isListening) return;
            try {
              recognition.start();
            } catch(e) {
              console.log("Could not restart:", e);
            }
          }, 1000);
        }
      };

      recognition.onend = () => {
        // Auto-restart if we're still supposed to be listening
        if (isListening) {
          setTimeout(() => {
            try {
              recognition.start();
            } catch(e) {
              console.log("Could not restart:", e);
              isListening = false;
            }
          }, 500);
        }
      };

      // Start recognition
      try {
        recognition.start();
        isListening = true;
        console.log("🎤 Listening started for language:", lang);
        // Show listening indicator
        const indicator = document.getElementById('listeningIndicator');
        if (indicator) {
          indicator.style.display = 'block';
        }
      } catch(e) {
        console.log("Error starting recognition:", e);
        alert("Could not start voice recognition. Please check microphone permissions.");
      }
    }

        // Handle voice commands
        function handleVoiceCommand(command, lang) {
          if (langCard && !langCard.classList.contains("hidden")) {
            // Language selection commands
            if (command.includes('english') || command.includes('eng') || command.includes('inglish')) {
              langButtons[0].click();
            } else if (command.includes('hindi') || command.includes('hind') || command.includes('हिंदी')) {
              langButtons[1].click();
            } else if (command.includes('kannada') || command.includes('kannad') || command.includes('ಕನ್ನಡ')) {
              langButtons[2].click();
            }
          } else if (authCard && !authCard.classList.contains("hidden")) {
            // Auth selection commands
            if (command.includes('register') || command.includes('sign up') || command.includes('नोંદणी') || command.includes('ನೋಂದಣಿ')) {
              document.getElementById("btnRegister").click();
            } else if (command.includes('login') || command.includes('log in') || command.includes('लॉगिन') || command.includes('ಲಾಗಿನ್')) {
              document.getElementById("btnLogin").click();
            } else if (command.includes('back') || command.includes('वापस') || command.includes('ಹಿಂದಕ್ಕೆ')) {
              document.getElementById("btnBackLang").click();
            }
          } else if (menu && !menu.classList.contains("hidden")) {
        // Menu commands
        if (lang === 'en') {
          if (command.includes('deposit')) {
            document.getElementById("btnDeposit").click();
          } else if (command.includes('withdraw')) {
            document.getElementById("btnWithdraw").click();
          } else if (command.includes('balance')) {
            document.getElementById("btnBalance").click();
          } else if (command.includes('transfer')) {
            document.getElementById("btnTransfer").click();
          } else if (command.includes('exit')) {
            document.getElementById("btnExit").click();
          }
        } else if (lang === 'hi') {
          if (command.includes('जमा') || command.includes('deposit')) {
            document.getElementById("btnDeposit").click();
          } else if (command.includes('निकाल') || command.includes('withdraw')) {
            document.getElementById("btnWithdraw").click();
          } else if (command.includes('बैलेंस') || command.includes('balance')) {
            document.getElementById("btnBalance").click();
          } else if (command.includes('स्थानांतरण') || command.includes('transfer')) {
            document.getElementById("btnTransfer").click();
          } else if (command.includes('बाहर') || command.includes('exit')) {
            document.getElementById("btnExit").click();
          }
        } else if (lang === 'kn') {
          // Kannada commands - also accept English as fallback
          if (command.includes('ಠೇವಣಿ') || command.includes('deposit') || command.includes('tevana')) {
            document.getElementById("btnDeposit").click();
          } else if (command.includes('ತೆಗೆಯ') || command.includes('withdraw') || command.includes('tegey') || command.includes('hanna tegey')) {
            document.getElementById("btnWithdraw").click();
          } else if (command.includes('ಬ್ಯಾಲೆನ್ಸ್') || command.includes('balance') || command.includes('balence')) {
            document.getElementById("btnBalance").click();
          } else if (command.includes('ವರ್ಗಾವಣೆ') || command.includes('transfer')) {
            document.getElementById("btnTransfer").click();
          } else if (command.includes('ನಿರ್ಗಮಿಸಿ') || command.includes('exit') || command.includes('nirgamisi')) {
            document.getElementById("btnExit").click();
          }
        }
      }
    }

    // Add listening indicator
    const listeningIndicator = document.createElement('div');
    listeningIndicator.id = 'listeningIndicator';
    listeningIndicator.innerHTML = '🎤 Listening...';
    listeningIndicator.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #ff6b6b; color: white; padding: 10px 20px; border-radius: 25px; font-size: 14px; font-weight: bold; display: none; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.3); animation: pulse 2s infinite;';
    document.body.appendChild(listeningIndicator);
    
    // Add pulse animation
    const style = document.createElement('style');
    style.textContent = '@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }';
    document.head.appendChild(style);



    // Check if user is logged in on page load
    window.addEventListener('load', () => {
      // Get stored language from sessionStorage
      const storedLang = sessionStorage.getItem('selectedLanguage');
      if (storedLang) {
        selectedLang = storedLang;
      }
      
      const loggedInAccount = sessionStorage.getItem('loggedInAccount');
      if (loggedInAccount) {
        // User is logged in, show menu directly in stored language
        langCard.classList.add("hidden");
        authCard.classList.add("hidden");
        menu.classList.remove("hidden");
        updateMenu(selectedLang || 'en');
        setTimeout(() => {
          speak(voicePrompts[selectedLang || 'en'].menuOptions, selectedLang || 'en');
          setTimeout(() => {
            listeningIndicator.style.display = 'block';
            startListening(selectedLang || 'en');
          }, 3000);
        }, 500);
      } else {
        // Normal flow - show language selection
        setTimeout(() => {
          speak(voicePrompts.en.langSelection, 'en');
          setTimeout(() => {
            listeningIndicator.style.display = 'block';
            startListening('en');
          }, 2000);
        }, 1000);
      }
    });

    // Update menu texts and links based on language
    function updateMenu(lang) {
      const menuTitle = document.getElementById("menuTitle");
      const btnDeposit = document.getElementById("btnDeposit");
      const btnWithdraw = document.getElementById("btnWithdraw");
      const btnBalance = document.getElementById("btnBalance");
      const btnTransfer = document.getElementById("btnTransfer");
      const btnExit = document.getElementById("btnExit");
      const mainTitle = document.getElementById("mainTitle");
      const mainSubtitle = document.getElementById("mainSubtitle");

      selectedLang = lang;

      if(lang === "kn") {
        mainTitle.className = "title kannada-text";
        mainSubtitle.className = "subtitle kannada-text";
        menuTitle.className = "kannada-text";
        mainTitle.innerText = "🤖 ಎಐ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್";
        mainSubtitle.innerText = "ನಿಮ್ಮ ಸ್ಮಾರ್ಟ್ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್ ಸಹಾಯಕ";
        menuTitle.innerText = "ಒಂದು ಆಯ್ಕೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ 🎙️";
        btnDeposit.innerText = "💰 ಠೇವಣಿ";
        btnDeposit.className = "btn btn-cyan kannada-text";
        btnWithdraw.innerText = "📉 ಹಣ ತೆಗೆಯಿರಿ";
        btnWithdraw.className = "btn btn-red kannada-text";
        btnBalance.innerText = "📊 ಬ್ಯಾಲೆನ್ಸ್ ನೋಡಿ";
        btnBalance.className = "btn btn-blue kannada-text";
        btnTransfer.innerText = "💸 ವರ್ಗಾವಣೆ";
        btnTransfer.className = "btn btn-transfer kannada-text";
        btnExit.innerText = "❌ ನಿರ್ಗಮಿಸಿ";
        btnExit.className = "btn btn-dark kannada-text";

        btnDeposit.onclick = () => window.location.href = "deposit_kn.html";
        btnWithdraw.onclick = () => window.location.href = "withdraw_kn.html";
        btnBalance.onclick = () => window.location.href = "balance_kn.html";
        btnTransfer.onclick = () => window.location.href = "transfer_kn.html";
      } 
      else if(lang === "hi") {
        mainTitle.className = "title";
        mainSubtitle.className = "subtitle";
        menuTitle.className = "";
        mainTitle.innerText = "🤖 एआई वॉयस बैंकिंग";
        mainSubtitle.innerText = "आपका स्मार्ट वॉयस बैंकिंग सहायक";
        menuTitle.innerText = "एक विकल्प चुनें 🎙️";
        btnDeposit.innerText = "💰 जमा करें";
        btnDeposit.className = "btn btn-cyan";
        btnWithdraw.innerText = "📉 निकालें";
        btnWithdraw.className = "btn btn-red";
        btnBalance.innerText = "📊 बैलेंस देखें";
        btnBalance.className = "btn btn-blue";
        btnTransfer.innerText = "💸 स्थानांतरण";
        btnTransfer.className = "btn btn-transfer";
        btnExit.innerText = "❌ बाहर जाएँ";
        btnExit.className = "btn btn-dark";

        btnDeposit.onclick = () => window.location.href = "deposit.hi.html";
        btnWithdraw.onclick = () => window.location.href = "withdraw.hi.html";
        btnBalance.onclick = () => window.location.href = "balence_hi.html";
        btnTransfer.onclick = () => window.location.href = "transfer.hi.html";
      } 
      else {
        mainTitle.className = "title";
        mainSubtitle.className = "subtitle";
        menuTitle.className = "";
        mainTitle.innerText = "🤖 AI Voice Banking";
        mainSubtitle.innerText = "Your smart voice assistant for banking";
        menuTitle.innerText = "Choose an Option 🎙️";
        btnDeposit.innerText = "💰 Deposit";
        btnDeposit.className = "btn btn-cyan";
        btnWithdraw.innerText = "📉 Withdraw";
        btnWithdraw.className = "btn btn-red";
        btnBalance.innerText = "📊 Balance";
        btnBalance.className = "btn btn-blue";
        btnTransfer.innerText = "💸 Transfer";
        btnTransfer.className = "btn btn-transfer";
        btnExit.innerText = "❌ Exit";
        btnExit.className = "btn btn-dark";

        btnDeposit.onclick = () => window.location.href = "deposit.html";
        btnWithdraw.onclick = () => window.location.href = "withdraw.html";
        btnBalance.onclick = () => window.location.href = "balence.html";
        btnTransfer.onclick = () => window.location.href = "transfer.html";
      }

      // Exit always returns to auth selection
      btnExit.onclick = () => {
        menu.classList.add("hidden");
        authCard.classList.remove("hidden");
        updateAuthPage(selectedLang);
        if (recognition && isListening) {
          recognition.stop();
          isListening = false;
          const indicator = document.getElementById('listeningIndicator');
          if (indicator) indicator.style.display = 'none';
        }
        const authPrompts = {
          en: "Please choose an option. Say Register, Login, or Back",
          hi: "कृपया एक विकल्प चुनें। पंजीकरण, लॉगिन, या वापस कहें",
          kn: "ದಯವಿಟ್ಟು ಒಂದು ಆಯ್ಕೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ। ನೋಂದಣಿ, ಲಾಗಿನ್, ಅಥವಾ ಹಿಂದಕ್ಕೆ ಎಂದು ಹೇಳಿ"
        };
        setTimeout(() => {
          speak(authPrompts[selectedLang], selectedLang);
          setTimeout(() => {
            listeningIndicator.style.display = 'block';
            startListening(selectedLang);
          }, 2000);
        }, 500);
      };
    }

    // Update auth page texts based on language
    function updateAuthPage(lang) {
      const authTitle = document.getElementById("authTitle");
      const authSubtitle = document.getElementById("authSubtitle");
      const registerText = document.getElementById("registerText");
      const loginText = document.getElementById("loginText");
      const backText = document.getElementById("backText");

      if(lang === "kn") {
        authTitle.innerText = "ಕನ್ನಡದಲ್ಲಿ ಮುಂದುವರಿಸಿ";
        authSubtitle.innerText = "ಮುಂದುವರಿಸಲು ದಯವಿಟ್ಟು ನೋಂದಣಿ ಮಾಡಿ ಅಥವಾ ಲಾಗಿನ್ ಮಾಡಿ";
        registerText.innerText = "ನೋಂದಣಿ";
        loginText.innerText = "ಲಾಗಿನ್";
        backText.innerText = "ಹಿಂದಕ್ಕೆ";
      } else if(lang === "hi") {
        authTitle.innerText = "हिंदी में जारी रखें";
        authSubtitle.innerText = "जारी रखने के लिए कृपया पंजीकरण करें या लॉगिन करें";
        registerText.innerText = "पंजीकरण";
        loginText.innerText = "लॉगिन";
        backText.innerText = "वापस";
      } else {
        authTitle.innerText = "Continue in English";
        authSubtitle.innerText = "Please register or log in to continue";
        registerText.innerText = "Register";
        loginText.innerText = "Login";
        backText.innerText = "Back";
      }
    }

    // Language selection - show auth page
    langButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        selectedLang = lang;
        // Store selected language in sessionStorage
        sessionStorage.setItem('selectedLanguage', lang);
        if (recognition && isListening) recognition.stop();
        langCard.classList.add("hidden");
        updateAuthPage(lang);
        authCard.classList.remove("hidden");
        
        // Speak auth options in selected language
        const authPrompts = {
          en: "Please choose an option. Say Register, Login, or Back",
          hi: "कृपया एक विकल्प चुनें। पंजीकरण, लॉगिन, या वापस कहें",
          kn: "ದಯವಿಟ್ಟು ಒಂದು ಆಯ್ಕೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ। ನೋಂದಣಿ, ಲಾಗಿನ್, ಅಥವಾ ಹಿಂದಕ್ಕೆ ಎಂದು ಹೇಳಿ"
        };
        setTimeout(() => {
          speak(authPrompts[lang], lang);
          setTimeout(() => {
            listeningIndicator.style.display = 'block';
            startListening(lang);
          }, 3000);
        }, 500);
      });
    });

    // Auth page button handlers
    document.getElementById("btnRegister").addEventListener("click", () => {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }
      const lang = selectedLang;
      // Store language before navigating
      sessionStorage.setItem('selectedLanguage', lang);
      // Always use register.html (it will adapt to language)
      window.location.href = "register.html";
    });

    document.getElementById("btnLogin").addEventListener("click", () => {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
      }
      const lang = selectedLang;
      // Store language before navigating
      sessionStorage.setItem('selectedLanguage', lang);
      // Always use login.html (it will adapt to language)
      window.location.href = "login.html";
    });

    document.getElementById("btnBackLang").addEventListener("click", () => {
      if (recognition && isListening) {
        recognition.stop();
        isListening = false;
        const indicator = document.getElementById('listeningIndicator');
        if (indicator) indicator.style.display = 'none';
      }
      authCard.classList.add("hidden");
      langCard.classList.remove("hidden");
      setTimeout(() => {
        speak(voicePrompts.en.langSelection, 'en');
        setTimeout(() => startListening('en'), 2000);
      }, 500);
    });


    // Add microphone button for manual voice activation
    const micButton = document.createElement('button');
    micButton.innerHTML = '🎤';
    micButton.id = 'micButton';
    micButton.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #4facfe; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; transition: all 0.3s;';
    micButton.onclick = () => {
      const currentLang = selectedLang;
        if (isListening) {
        // Stop listening
        try {
          recognition.stop();
          isListening = false;
          micButton.style.background = '#4facfe';
          micButton.innerHTML = '🎤';
          listeningIndicator.style.display = 'none';
        } catch(e) {}
      } else {
        // Start listening
        if (langCard && !langCard.classList.contains("hidden")) {
          speak(voicePrompts.en.langSelection, 'en');
          setTimeout(() => startListening('en'), 2000);
        } else if (menu && !menu.classList.contains("hidden")) {
          speak(voicePrompts[currentLang].menuOptions, currentLang);
          setTimeout(() => startListening(currentLang), 2000);
        }
      }
    };
    document.body.appendChild(micButton);

  </script>
</body>
</html>
