<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Voice Banking</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/admin.css">
</head>
<body class="adm">

<section class="gate" id="gate">
  <form class="gate__card" id="gate-form" autocomplete="off">
    <div class="gate__brand" id="gate-brand"></div>
    <h1>Admin sign in</h1>
    <p>Enter the admin token from <code>backend/.env</code> to open the panel.</p>
    <label class="field"><span>Admin token</span><input class="input" id="token" type="password" required autocomplete="off"></label>
    <div class="err" id="gate-err" role="alert"></div>
    <button class="btn btn--primary" style="width:100%;justify-content:center" type="submit">Open admin panel</button>
  </form>
</section>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="side__brand" id="side-brand"></div>
    <nav class="nav" id="nav" aria-label="Admin sections"></nav>
    <div class="side__foot"><div>Signed in with the admin token</div><button type="button" id="lock"></button></div>
  </aside>
  <div class="stage">
    <header class="bar"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="actions" id="bar-actions"></div></header>
    <main class="view" id="view" aria-live="polite"></main>
  </div>
</div>

<div id="overlay"></div>
<script src="js/i18n.js"></script><script src="js/numwords.js"></script><script src="js/api.js"></script><script src="js/voice.js"></script><script src="js/ui.js"></script>
<script src="js/pages/admin.js"></script>
</body>
</html>
