<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Voice Banking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<header id="topbar"></header>
<main class="page" id="main">

<section data-view="splash" class="splash" id="v-splash" hidden><div class="splash__inner">
<div class="splash__seal"><svg viewBox="0 0 76 48" fill="currentColor" aria-hidden="true"><rect x="2" y="16" width="8" height="16" rx="4"/><rect x="18" y="6" width="8" height="36" rx="4"/><rect x="34" y="12" width="8" height="24" rx="4"/><rect x="50" y="2" width="8" height="44" rx="4"/><rect x="66" y="18" width="8" height="12" rx="4"/></svg></div>
<p class="eyebrow" data-i18n="tagline"></p>
<h1 class="display" data-i18n="splash.title"></h1>
<button class="btn btn--primary" id="begin" type="button" data-i18n="splash.begin"></button>
<p class="splash__note" data-i18n="splash.note"></p></div></section>

<section data-view="lang" id="v-lang" hidden>
<div class="head"><p class="eyebrow" data-i18n="lang.eyebrow"></p><h1 class="display" data-i18n="lang.title"></h1><p class="lede" data-i18n="lang.sub"></p></div>
<div class="choices">
<button class="choice" type="button" data-l="en"><span><span class="choice__name" lang="en">English</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="choice" type="button" data-l="hi"><span><span class="choice__name" lang="hi">हिन्दी</span><span class="choice__tag" style="display:block">Hindi</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="choice" type="button" data-l="kn"><span><span class="choice__name" lang="kn">ಕನ್ನಡ</span><span class="choice__tag" style="display:block">Kannada</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div></section>

<section data-view="auth" id="v-auth" hidden>
<div class="head"><p class="eyebrow" data-i18n="auth.eyebrow"></p><h1 class="display" data-i18n="auth.title"></h1><p class="lede" data-i18n="auth.sub"></p></div>
<div class="card"><div class="actions" style="margin-top:0">
<button class="btn btn--primary btn--block" id="go-login" type="button" data-i18n="auth.login"></button>
<button class="btn btn--ghost btn--block" id="go-register" type="button" data-i18n="auth.register"></button>
<button class="btn btn--ghost btn--block" id="back-lang" type="button" data-i18n="back"></button></div></div></section>

<section data-view="menu" id="v-menu" hidden>
<div class="head"><p class="eyebrow" data-i18n="menu.eyebrow"></p><h1 class="display" id="hello"></h1><p class="lede" data-i18n="menu.title"></p></div>
<div class="tiles"><button class="tile" type="button" data-go="balance"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z"/><circle cx="16" cy="13.5" r="1.1"/></svg></span><span><span class="tile__title" data-i18n="menu.balance"></span><span class="tile__sub" style="display:block" data-i18n="menu.balance.s"></span></span></button><button class="tile" type="button" data-go="deposit"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg></span><span><span class="tile__title" data-i18n="menu.deposit"></span><span class="tile__sub" style="display:block" data-i18n="menu.deposit.s"></span></span></button><button class="tile" type="button" data-go="withdraw"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 20h14"/></svg></span><span><span class="tile__title" data-i18n="menu.withdraw"></span><span class="tile__sub" style="display:block" data-i18n="menu.withdraw.s"></span></span></button><button class="tile" type="button" data-go="transfer"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14m0 0l-3.5-3.5M18 8l-3.5 3.5M20 16H6m0 0l3.5-3.5M6 16l3.5 3.5"/></svg></span><span><span class="tile__title" data-i18n="menu.transfer"></span><span class="tile__sub" style="display:block" data-i18n="menu.transfer.s"></span></span></button><button class="tile tile--wide" type="button" data-go="loan"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8m4-8v8m6-8v8m4-8v8M3 20h18"/></svg></span><span><span class="tile__title" data-i18n="menu.loan"></span><span class="tile__sub" style="display:block" data-i18n="menu.loan.s"></span></span></button></div></section>

</main>
<script src="js/i18n.js"></script><script src="js/numwords.js"></script><script src="js/api.js"></script><script src="js/voice.js"></script><script src="js/ui.js"></script>
<script src="js/pages/index.js"></script>
</body>
</html>
