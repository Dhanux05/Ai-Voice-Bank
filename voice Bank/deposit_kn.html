<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಠೇವಣಿ - ಎಐ ವಾಯ್ಸ್ ಬ್ಯಾಂಕಿಂಗ್</title>
  <link rel="stylesheet" href="style2.css">
</head>
<style>
    /* Quick Amount Bubbles */
    .quick-amounts {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .amount-bubble {
      background: #4facfe;
      color: white;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .amount-bubble:hover {
      background: #00c6ff;
      transform: scale(1.1);
    }
  </style>
<body>
  <div class="bg-animation"></div>
  <div class="container">
    <h1 class="title">💰 ಠೇವಣಿ</h1>
    <p class="subtitle">ಹಣ ಠೇವಣಿ ಮಾಡಲು ವಿವರಗಳನ್ನು ಭರ್ತಿ ಮಾಡಿ</p>

    <form class="form-card fade-in">
      <div class="input-group">
        <input type="text" maxlength="12" pattern="[0-9]{12}" required>
        <label>ಖಾತೆ ಸಂಖ್ಯೆ (12 ಅಂಕೆಗಳು)</label>
      </div>

      <div class="input-group">
        <input type="number" id="depositAmount" required>
        <label>ಠೇವಣಿ ಮೊತ್ತ (₹)</label>
      </div>

      <!-- Quick Amount Bubbles -->
      <div class="quick-amounts">
        <button type="button" class="amount-bubble" data-value="500">₹500</button>
        <button type="button" class="amount-bubble" data-value="1000">₹1000</button>
        <button type="button" class="amount-bubble" data-value="2000">₹2000</button>
        <button type="button" class="amount-bubble" data-value="5000">₹5000</button>
      </div>

      <button type="submit" class="btn-submit">✅ ಠೇವಣಿ</button>
      <a href="index.html" class="btn-back">⬅️ ಹಿಂದಕ್ಕೆ</a>
    </form>
  </div>

  <script>
    // Quick amount buttons
    document.querySelectorAll(".amount-bubble").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("depositAmount").value = button.dataset.value;
      });
    });

    // Voice functionality
    let recognition = null;
    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'kn-IN';
    }

    function getVoices() {
      return speechSynthesis.getVoices();
    }
    
    function speak(text, useEnglish = false) {
      const voices = getVoices();
      const utterance = new SpeechSynthesisUtterance(text);
      
      if (useEnglish) {
        utterance.lang = 'en-US';
        // Transliterate Kannada prompts to English for TTS
        const englishText = text
          .replace(/ಠೇವಣಿ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ/g, 'Welcome to deposit page')
          .replace(/ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ/g, 'Please say your account number')
          .replace(/ನಂತರ ಠೇವಣಿ ಮೊತ್ತ/g, 'then deposit amount')
          .replace(/ಖಾತೆ ಸಂಖ್ಯೆ/g, 'account number')
          .replace(/ನಮೂದಿಸಲಾಗಿದೆ/g, 'entered')
          .replace(/ದಯವಿಟ್ಟು ಠೇವಣಿ ಮೊತ್ತವನ್ನು ಹೇಳಿ/g, 'Please say the deposit amount')
          .replace(/ಮೊತ್ತ/g, 'amount')
          .replace(/ರೂಪಾಯಿ/g, 'rupees')
          .replace(/ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ/g, 'processing')
          .replace(/ಯಶಸ್ವಿಯಾಗಿದೆ/g, 'successful')
          .replace(/ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್/g, 'new balance')
          .replace(/ದಯವಿಟ್ಟು/g, 'please')
          .replace(/ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ/g, 'try again')
          .replace(/ವಿಫಲವಾಗಿದೆ/g, 'failed');
        utterance.text = englishText || text;
        console.log("⚠️ Using English fallback for Kannada");
      } else {
        // Try to find Kannada voice - check multiple patterns
        const kannadaVoice = voices.find(v => 
          v.lang.toLowerCase().startsWith('kn') || 
          v.lang.toLowerCase().includes('kannada') || 
          v.name.toLowerCase().includes('kannada') ||
          v.lang === 'kn-IN' ||
          v.lang === 'kn'
        );
        
        if (kannadaVoice) {
          utterance.lang = 'kn-IN';
          utterance.voice = kannadaVoice;
          utterance.text = text;
          console.log("✅ Using Kannada voice:", kannadaVoice.name, kannadaVoice.lang);
        } else {
          console.log("⚠️ Kannada voice not found. Available voices:", voices.map(v => v.lang + ' - ' + v.name).slice(0, 5));
          // Still try to use Kannada language code - browser might have a fallback
          utterance.lang = 'kn-IN';
          utterance.text = text; // Keep original Kannada text
          console.log("🔊 Attempting to speak Kannada text with kn-IN language code");
        }
      }
      
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      console.log("🔊 Speaking in Kannada page:", text.substring(0, 50));
      speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!recognition) return;
      recognition.start();
      isListening = true;
      recognition.onresult = (event) => {
        const command = event.results[0][0].transcript.toLowerCase().trim();
        handleVoiceCommand(command);
      };
      recognition.onend = () => { isListening = false; };
    }

    function handleVoiceCommand(command) {
      const accountInput = form.querySelector("input[type='text']");
      const amountInput = document.getElementById("depositAmount");
      const accountMatch = command.match(/(?:ಖಾತೆ|ಸಂಖ್ಯೆ|account|number)\s*(\d+)|(\d{12})|(\d{4,12})/);
      if (accountMatch) {
        const accNum = accountMatch[1] || accountMatch[2];
        accountInput.value = accNum;
        speak(`ಖಾತೆ ಸಂಖ್ಯೆ ${accNum} ನಮೂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಠೇವಣಿ ಮೊತ್ತವನ್ನು ಹೇಳಿ.`);
        setTimeout(() => startListening(), 2000);
        return;
      }
      const amountMatch = command.match(/(\d+)\s*(?:ರೂಪಾಯಿ|rupees|rs|ಮೊತ್ತ)/i) || command.match(/(\d+)/);
      if (amountMatch && accountInput.value) {
        const amount = amountMatch[1];
        amountInput.value = amount;
        speak(`ಮೊತ್ತ ${amount} ರೂಪಾಯಿ ನಮೂದಿಸಲಾಗಿದೆ. ಠೇವಣಿ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ.`);
        setTimeout(() => form.dispatchEvent(new Event('submit')), 1000);
        return;
      }
      if (command.includes('ಐದು ನೂರು') || command.includes('500') || command.includes('five hundred')) {
        amountInput.value = 500;
        speak("ಐದು ನೂರು ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ");
      } else if (command.includes('ಒಂದು ಸಾವಿರ') || command.includes('1000') || command.includes('one thousand')) {
        amountInput.value = 1000;
        speak("ಒಂದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ");
      } else if (command.includes('ಎರಡು ಸಾವಿರ') || command.includes('2000') || command.includes('two thousand')) {
        amountInput.value = 2000;
        speak("ಎರಡು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ");
      } else if (command.includes('ಐದು ಸಾವಿರ') || command.includes('5000') || command.includes('five thousand')) {
        amountInput.value = 5000;
        speak("ಐದು ಸಾವಿರ ರೂಪಾಯಿ ಆಯ್ಕೆಮಾಡಲಾಗಿದೆ");
      } else if (command.includes('ಸಲ್ಲಿಸು') || command.includes('submit') || command.includes('deposit')) {
        form.dispatchEvent(new Event('submit'));
      }
    }

    // Wait for voices to load
    let voicesLoaded = false;
    speechSynthesis.onvoiceschanged = () => {
      voicesLoaded = true;
      const voices = speechSynthesis.getVoices();
      const kannadaVoice = voices.find(v => v.lang.startsWith('kn'));
      if (!kannadaVoice) {
        console.log("Kannada voice not available, using English fallback");
      }
    };

    window.addEventListener('load', () => {
      // Load voices first
      if (!voicesLoaded) {
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) voicesLoaded = true;
      }
      
      setTimeout(() => {
        const kannadaText = "ಠೇವಣಿ ಪುಟಕ್ಕೆ ಸ್ವಾಗತ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆಯನ್ನು ಹೇಳಿ, ನಂತರ ಠೇವಣಿ ಮೊತ್ತ. ನೀವು ತ್ವರಿತ ಮೊತ್ತಗಳನ್ನು ಹೇಳಬಹುದು ಐದು ನೂರು, ಒಂದು ಸಾವಿರ, ಎರಡು ಸಾವಿರ, ಅಥವಾ ಐದು ಸಾವಿರ ರೂಪಾಯಿ.";
        const englishText = "Welcome to deposit page. Please say your account number, then deposit amount. You can say quick amounts like five hundred, one thousand, two thousand, or five thousand rupees.";
        
        // Try Kannada first, fallback to English
        speak(kannadaText);
        setTimeout(() => startListening(), 5000);
      }, 1000);
    });

    // Handle form submission
    const form = document.querySelector("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (recognition && isListening) recognition.stop();
      const account_number = form.querySelector("input[type='text']").value.trim();
      const deposit_amount = parseFloat(document.getElementById("depositAmount").value);
      if (!account_number || !deposit_amount) {
        speak("ದಯವಿಟ್ಟು ಖಾತೆ ಸಂಖ್ಯೆ ಮತ್ತು ಮೊತ್ತವನ್ನು ನಮೂದಿಸಿ");
        return;
      }
      speak("ನಿಮ್ಮ ಠೇವಣಿ ಪ್ರಕ್ರಿಯೆಗೊಳಿಸಲಾಗುತ್ತಿದೆ. ದಯವಿಟ್ಟು ನಿರೀಕ್ಷಿಸಿ.");
      const response = await fetch("http://localhost:5000/deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account_number, deposit_amount })
      });
      const data = await response.json();
      if (response.ok && data.new_balance !== undefined) {
        speak(`ಠೇವಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ! ನಿಮ್ಮ ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್ ${data.new_balance} ರೂಪಾಯಿ.`);
        
        // Store transaction data for receipt
        const transactionData = {
          type: 'Deposit',
          type_kn: 'ಠೇವಣಿ',
          account_number: data.account_number,
          full_name: data.full_name,
          branch_name: data.branch_name,
          amount: deposit_amount,
          old_balance: data.old_balance,
          new_balance: data.new_balance,
          transaction_id: generateTransactionId()
        };
        
        // Show success message with download option
        showSuccessMessage(transactionData);
      } else {
        speak(data.message || "ಠೇವಣಿ ವಿಫಲವಾಗಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.");
        alert(data.message);
      }
    });

    // Generate Transaction ID
    function generateTransactionId() {
      const timestamp = Date.now();
      const random = Math.floor(Math.random() * 10000);
      return `TXN${timestamp}${random}`;
    }

    // Store current transaction data
    let currentTransactionData = null;

    // Show Success Message with Download Option
    function showSuccessMessage(transactionData) {
      currentTransactionData = transactionData;
      
      const message = `
        <div style="text-align: center; padding: 20px;">
          <h2 style="color: #4ade80; margin-bottom: 15px; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);">✅ ಠೇವಣಿ ಯಶಸ್ವಿಯಾಗಿದೆ!</h2>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಖಾತೆ:</strong> ${transactionData.account_number}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹೆಸರು:</strong> ${transactionData.full_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಶಾಖೆ:</strong> ${transactionData.branch_name}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಠೇವಣಿ ಮೊತ್ತ:</strong> ₹${transactionData.amount.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹಳೆಯ ಬ್ಯಾಲೆನ್ಸ್:</strong> ₹${transactionData.old_balance.toLocaleString('en-IN')}</p>
          <p style="color: #e0e0e0;"><strong style="color: #ffffff;">ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್:</strong> ₹${transactionData.new_balance.toLocaleString('en-IN')}</p>
          <div style="margin-top: 20px;">
            <button id="downloadReceiptBtn" 
                    style="background: #4facfe; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              📥 ರಸೀತಿ ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ
            </button>
            <button id="closeModalBtn" 
                    style="background: #6c757d; color: white; border: none; padding: 12px 30px; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px;">
              ಮುಚ್ಚಿ
            </button>
          </div>
        </div>
      `;
      
      const modal = document.createElement('div');
      modal.id = 'successModal';
      modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center;';
      
      const modalContent = document.createElement('div');
      modalContent.style.cssText = 'background: rgba(15, 27, 46, 0.95); padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(33, 150, 243, 0.3); border: 1px solid rgba(33, 150, 243, 0.3); color: white;';
      modalContent.innerHTML = message;
      
      modal.appendChild(modalContent);
      document.body.appendChild(modal);
      
      setTimeout(() => {
        const downloadBtn = document.getElementById('downloadReceiptBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        
        if (downloadBtn) {
          downloadBtn.addEventListener('click', () => {
            if (currentTransactionData) {
              downloadReceipt(currentTransactionData);
            }
          });
        }
        
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            closeSuccessMessage();
          });
        }
      }, 100);
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeSuccessMessage();
        }
      });
    }

    function closeSuccessMessage() {
      const modal = document.getElementById('successModal');
      if (modal) {
        modal.remove();
      }
    }

    function downloadReceipt(transactionData) {
      const now = new Date();
      const dateStr = now.toLocaleDateString('kn-IN', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
      const timeStr = now.toLocaleTimeString('kn-IN', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      });

      const receiptHTML = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Transaction Receipt - ${transactionData.transaction_id}</title>
  <style>
    @media print { body { margin: 0; } .no-print { display: none; } }
    body { font-family: 'Arial', 'Noto Sans Kannada', sans-serif; max-width: 600px; margin: 20px auto; padding: 30px; background: #f5f5f5; }
    .receipt-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .header { text-align: center; border-bottom: 3px solid #4facfe; padding-bottom: 20px; margin-bottom: 30px; }
    .bank-name { font-size: 28px; font-weight: bold; color: #4facfe; margin-bottom: 5px; }
    .bank-tagline { font-size: 14px; color: #666; }
    .receipt-title { text-align: center; font-size: 24px; font-weight: bold; color: #32CD32; margin: 20px 0; }
    .transaction-info { margin: 25px 0; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info-label { font-weight: bold; color: #333; }
    .info-value { color: #666; text-align: right; }
    .amount-row { background: #f0f8ff; padding: 15px; border-radius: 5px; margin: 20px 0; }
    .amount-label { font-size: 18px; font-weight: bold; color: #4facfe; }
    .amount-value { font-size: 24px; font-weight: bold; color: #32CD32; margin-top: 5px; }
    .balance-info { background: #f9f9f9; padding: 15px; border-radius: 5px; margin: 20px 0; }
    .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; color: #999; font-size: 12px; }
    .transaction-id { background: #fff3cd; padding: 10px; border-radius: 5px; text-align: center; margin: 20px 0; font-family: 'Courier New', monospace; font-weight: bold; color: #856404; }
  </style>
</head>
<body>
  <div class="receipt-container">
    <div class="header">
      <div class="bank-name">🤖 AI Voice Banking</div>
      <div class="bank-tagline">ನಿಮ್ಮ ಸ್ಮಾರ್ಟ್ ಬ್ಯಾಂಕಿಂಗ್ ಪರಿಹಾರ</div>
    </div>
    <div class="receipt-title">${transactionData.type_kn} ರಸೀತಿ</div>
    <div class="transaction-id">ವಹಿವಾಟು ID: ${transactionData.transaction_id}</div>
    <div class="transaction-info">
      <div class="info-row"><span class="info-label">ಖಾತೆ ಸಂಖ್ಯೆ:</span><span class="info-value">${transactionData.account_number}</span></div>
      <div class="info-row"><span class="info-label">ಹೆಸರು:</span><span class="info-value">${transactionData.full_name}</span></div>
      <div class="info-row"><span class="info-label">ಶಾಖೆ:</span><span class="info-value">${transactionData.branch_name}</span></div>
      <div class="info-row"><span class="info-label">ದಿನಾಂಕ:</span><span class="info-value">${dateStr}</span></div>
      <div class="info-row"><span class="info-label">ಸಮಯ:</span><span class="info-value">${timeStr}</span></div>
    </div>
    <div class="amount-row">
      <div class="amount-label">ಠೇವಣಿ ಮೊತ್ತ</div>
      <div class="amount-value">₹${transactionData.amount.toLocaleString('en-IN')}</div>
    </div>
    <div class="balance-info">
      <div class="info-row"><span class="info-label">ಹಳೆಯ ಬ್ಯಾಲೆನ್ಸ್:</span><span class="info-value">₹${transactionData.old_balance.toLocaleString('en-IN')}</span></div>
      <div class="info-row"><span class="info-label">ಹೊಸ ಬ್ಯಾಲೆನ್ಸ್:</span><span class="info-value">₹${transactionData.new_balance.toLocaleString('en-IN')}</span></div>
    </div>
    <div class="footer">
      <p>ಧನ್ಯವಾದ! ನಿಮ್ಮ ವಹಿವಾಟು ಯಶಸ್ವಿಯಾಗಿದೆ.</p>
      <p>ಇದು ಕಂಪ್ಯೂಟರ್-ಉತ್ಪಾದಿತ ರಸೀತಿ ಮತ್ತು ಸಹಿಯ ಅಗತ್ಯವಿಲ್ಲ.</p>
    </div>
  </div>
</body>
</html>`;

      const blob = new Blob([receiptHTML], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Receipt_${transactionData.transaction_id}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const micBtn = document.createElement('button');
    micBtn.innerHTML = '🎤';
    micBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #4facfe; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;';
    micBtn.onclick = () => {
      speak("ಕೇಳುತ್ತಿದ್ದೇನೆ. ದಯವಿಟ್ಟು ನಿಮ್ಮ ಖಾತೆ ಸಂಖ್ಯೆ ಮತ್ತು ಮೊತ್ತವನ್ನು ಹೇಳಿ.");
      startListening();
    };
    document.body.appendChild(micBtn);
  </script>
</body>
</html>
